<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>なないろ菜 発注システム</title>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    /* スマホ特有のタップハイライトを消す */
    * { -webkit-tap-highlight-color: transparent; }
    /* iPhoneの画面下部の安全領域を確保 */
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 5rem); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { ShoppingCart, ClipboardList, Plus, Minus, X, CheckCircle, Store, Clock, History } = lucide;

    // =========================================================================
    // ⚠️ 必須設定：以下の2つを、ご自身のURLとIDに必ず書き換えてください！
    // =========================================================================
    const GAS_URL = "ここにGASのウェブアプリURLを貼り付けます"; 
    const LIFF_ID = "ここにLIFF_IDを貼り付けます";
    // =========================================================================

    // 商品データ（後で写真はご自身のものに差し替えられます）
    const initialProducts = [
      { id: 1, name: "なないろ菜", price: 400, stock: "在庫あり", img: "https://placehold.co/150x150/e2e8f0/64748b?text=Nanairo" },
      { id: 2, name: "デトロイト", price: 400, stock: "残りわずか", img: "https://placehold.co/150x150/e2e8f0/64748b?text=Detroit" },
      { id: 3, name: "青じそ", price: 400, stock: "在庫あり", img: "https://placehold.co/150x150/e2e8f0/64748b?text=Aojiso" },
      { id: 4, name: "レッドマスタード", price: 400, stock: "在庫あり", img: "https://placehold.co/150x150/e2e8f0/64748b?text=Mustard" },
    ];

    const App = () => {
      // 状態管理（State）
      const [liffProfile, setLiffProfile] = useState({ displayName: "お客様", userId: "" });
      const [activeTab, setActiveTab] = useState('home'); // 'home' または 'history'
      const [cart, setCart] = useState({});
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [pickupDate, setPickupDate] = useState("");
      const [pickupTime, setPickupTime] = useState("11:00-12:00");
      const [memo, setMemo] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false); // ★連打防止フラグ
      const [isComplete, setIsComplete] = useState(false);

      // LIFFの初期化
      useEffect(() => {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(profile => {
                setLiffProfile({ displayName: profile.displayName, userId: profile.userId });
              });
            } else {
              liff.login();
            }
          })
          .catch(err => console.error("LIFF Init Error:", err));
          
        // 今日の日付を初期値にセット
        const today = new Date().toISOString().split('T')[0];
        setPickupDate(today);
      }, []);

      // カートの操作
      const updateCart = (productId, change) => {
        setCart(prev => {
          const current = prev[productId] || 0;
          const next = Math.max(0, current + change);
          const newCart = { ...prev };
          if (next === 0) delete newCart[productId];
          else newCart[productId] = next;
          return newCart;
        });
      };

      const getCartItems = () => {
        return Object.entries(cart).map(([id, quantity]) => {
          const product = initialProducts.find(p => p.id === parseInt(id));
          return { ...product, quantity };
        });
      };

      const totalPrice = getCartItems().reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const totalQuantity = getCartItems().reduce((sum, item) => sum + item.quantity, 0);

      // ★ 注文送信処理（連打防止つき）
      const submitOrder = async () => {
        if (!pickupDate) return alert("お受け取り日を入力してください。");
        
        setIsSubmitting(true); // ★ボタンを無効化して「送信中」にする

        const orderItemsStr = getCartItems().map(item => `${item.name} × ${item.quantity}`).join("\n");
        const orderData = {
          userName: liffProfile.displayName,
          userId: liffProfile.userId,
          orderItems: orderItemsStr,
          pickupDate: pickupDate,
          pickupTime: pickupTime,
          memo: memo,
          totalPrice: totalPrice
        };

        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(orderData)
          });
          const result = await res.json();
          
          if (result.status === "success") {
            // ローカルに履歴を保存
            saveOrderHistory(orderData);
            setIsComplete(true);
            setCart({});
          }
        } catch (error) {
          alert("通信エラーが発生しました。もう一度お試しください。");
        } finally {
          setIsSubmitting(false); // ★処理が終わったらフラグを戻す
        }
      };

      // 履歴保存関数
      const saveOrderHistory = (orderData) => {
        const history = JSON.parse(localStorage.getItem('nanairo_history') || '[]');
        history.unshift({
          date: new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
          items: orderData.orderItems,
          total: orderData.totalPrice,
          pickup: `${orderData.pickupDate} ${orderData.pickupTime}`
        });
        localStorage.setItem('nanairo_history', JSON.stringify(history));
      };

      // --- 画面パーツ：商品一覧 ---
      const HomeTab = () => (
        <div className="p-4 space-y-4">
          <div className="bg-emerald-50 rounded-xl p-4 mb-4 text-emerald-800">
            <h2 className="font-bold">ようこそ、{liffProfile.displayName} 様</h2>
            <p className="text-sm mt-1">ご希望のマイクロハーブをお選びください。</p>
          </div>
          
          <div className="grid grid-cols-2 gap-3">
            {initialProducts.map(p => (
              <div key={p.id} className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                <img src={p.img} alt={p.name} className="w-full h-32 object-cover" />
                <div className="p-3">
                  <h3 className="font-bold text-gray-800 leading-tight">{p.name}</h3>
                  <p className="text-emerald-600 font-bold mt-1">¥{p.price}</p>
                  
                  {/* 個数選択 */}
                  {cart[p.id] ? (
                    <div className="flex items-center justify-between mt-3 bg-emerald-50 rounded-lg p-1">
                      <button onClick={() => updateCart(p.id, -1)} className="w-8 h-8 flex justify-center items-center text-emerald-600"><Minus size={18} /></button>
                      <span className="font-bold text-emerald-800">{cart[p.id]}</span>
                      <button onClick={() => updateCart(p.id, 1)} className="w-8 h-8 flex justify-center items-center text-emerald-600"><Plus size={18} /></button>
                    </div>
                  ) : (
                    <button onClick={() => updateCart(p.id, 1)} className="w-full mt-3 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-bold transition">
                      追加する
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      // --- 画面パーツ：注文履歴 ---
      const HistoryTab = () => {
        const history = JSON.parse(localStorage.getItem('nanairo_history') || '[]');
        return (
          <div className="p-4">
            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
              <History className="text-emerald-600" size={20} /> 最近のご注文
            </h2>
            {history.length === 0 ? (
              <p className="text-gray-500 text-center py-10 bg-white rounded-xl shadow-sm">履歴はありません。</p>
            ) : (
              <div className="space-y-3">
                {history.map((h, i) => (
                  <div key={i} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p className="text-xs text-gray-400 mb-2">{h.date} 注文</p>
                    <p className="whitespace-pre-line text-sm text-gray-700 font-medium leading-relaxed">{h.items}</p>
                    <div className="flex justify-between items-end mt-3 pt-3 border-t border-gray-100">
                      <span className="text-xs text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded">受取: {h.pickup}</span>
                      <span className="font-bold text-gray-800">¥{h.total.toLocaleString()}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      // 完了画面
      if (isComplete) {
        return (
          <div className="h-screen flex flex-col items-center justify-center bg-emerald-50 p-6 text-center">
            <CheckCircle size={64} className="text-emerald-500 mb-4" />
            <h2 className="text-2xl font-bold text-emerald-800 mb-2">ご注文完了</h2>
            <p className="text-emerald-600 mb-8">LINEに確認メッセージをお送りしました。<br/>ご来店をお待ちしております。</p>
            <button onClick={() => liff.closeWindow()} className="w-full bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg">
              LINEのトーク画面に戻る
            </button>
          </div>
        );
      }

      return (
        <div className="h-screen flex flex-col bg-gray-50 relative pb-safe">
          
          {/* メインコンテンツエリア */}
          <div className="flex-1 overflow-y-auto">
            {activeTab === 'home' ? <HomeTab /> : <HistoryTab />}
          </div>

          {/* フローティング「カートを見る」帯（タブに被らないように配置） */}
          {totalQuantity > 0 && !isCartOpen && (
            <div className="fixed bottom-[4.5rem] left-0 w-full p-4 z-40">
              <button 
                onClick={() => setIsCartOpen(true)}
                className="w-full bg-emerald-600 text-white shadow-lg rounded-xl flex items-center justify-between p-4 active:scale-95 transition-transform"
              >
                <div className="flex items-center gap-2 font-bold">
                  <div className="bg-white text-emerald-600 w-6 h-6 rounded-full flex items-center justify-center text-sm">{totalQuantity}</div>
                  カートを確認
                </div>
                <div className="font-bold text-lg">¥{totalPrice.toLocaleString()}</div>
              </button>
            </div>
          )}

          {/* 新設：ボトムナビゲーション（タブ） */}
          <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex h-16 z-30 pb-safe">
            <button 
              onClick={() => setActiveTab('home')} 
              className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'home' ? 'text-emerald-600' : 'text-gray-400'}`}
            >
              <Store size={24} />
              <span className="text-[10px] font-bold">商品を選ぶ</span>
            </button>
            <button 
              onClick={() => setActiveTab('history')} 
              className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'history' ? 'text-emerald-600' : 'text-gray-400'}`}
            >
              <History size={24} />
              <span className="text-[10px] font-bold">注文履歴</span>
            </button>
          </div>

          {/* 改良版：カート画面（モーダル）- 余白を極力なくしました */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-gray-50 z-50 flex flex-col">
              {/* ヘッダー */}
              <div className="bg-white border-b px-4 py-3 flex justify-between items-center shrink-0">
                <h2 className="font-bold text-lg flex items-center gap-2"><ShoppingCart size={20}/> ご注文内容</h2>
                <button onClick={() => setIsCartOpen(false)} className="p-2 -mr-2 text-gray-500 rounded-full hover:bg-gray-100"><X size={24} /></button>
              </div>

              {/* スクロールエリア */}
              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {/* 選択したアイテム */}
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3">
                  {getCartItems().map(item => (
                    <div key={item.id} className="flex justify-between items-center py-2 border-b last:border-0 border-gray-50">
                      <div className="font-bold text-gray-700">{item.name}</div>
                      <div className="flex items-center gap-3">
                        <button onClick={() => updateCart(item.id, -1)} className="w-8 h-8 flex justify-center items-center bg-gray-100 rounded-lg text-gray-600"><Minus size={16}/></button>
                        <span className="w-4 text-center font-bold">{item.quantity}</span>
                        <button onClick={() => updateCart(item.id, 1)} className="w-8 h-8 flex justify-center items-center bg-gray-100 rounded-lg text-gray-600"><Plus size={16}/></button>
                      </div>
                    </div>
                  ))}
                  <div className="mt-3 pt-3 border-t flex justify-between items-center">
                    <span className="text-gray-500 font-bold">合計</span>
                    <span className="text-xl font-bold text-emerald-600">¥{totalPrice.toLocaleString()}</span>
                  </div>
                </div>

                {/* 受け取り日時 */}
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3 space-y-3">
                  <h3 className="font-bold text-gray-700 flex items-center gap-2"><Clock size={16}/> お受け取り日時</h3>
                  <div className="flex gap-2">
                    <input type="date" value={pickupDate} onChange={e => setPickupDate(e.target.value)} className="flex-1 border-gray-200 bg-gray-50 rounded-lg p-2 text-sm font-medium" />
                    <select value={pickupTime} onChange={e => setPickupTime(e.target.value)} className="flex-1 border-gray-200 bg-gray-50 rounded-lg p-2 text-sm font-medium">
                      <option value="11:00-12:00">11:00-12:00</option>
                      <option value="13:00-14:00">13:00-14:00</option>
                      <option value="15:00-16:00">15:00-16:00</option>
                      <option value="16:00-17:00">16:00-17:00</option>
                    </select>
                  </div>
                </div>

                {/* メモ */}
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3">
                  <h3 className="font-bold text-gray-700 mb-2 flex items-center gap-2"><ClipboardList size={16}/> 備考・メモ</h3>
                  <textarea value={memo} onChange={e => setMemo(e.target.value)} placeholder="ご要望などがあればご記入ください" className="w-full border-gray-200 bg-gray-50 rounded-lg p-3 text-sm focus:ring-2 focus:ring-emerald-500" rows="2"></textarea>
                </div>
              </div>

              {/* 固定の注文ボタン（余白なし） */}
              <div className="bg-white border-t p-4 shrink-0 pb-safe">
                <button 
                  onClick={submitOrder}
                  disabled={isSubmitting}
                  className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg flex justify-center items-center gap-2 transition
                    ${isSubmitting ? 'bg-gray-400 text-white cursor-not-allowed' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}
                >
                  {isSubmitting ? (
                    <>処理中... しばらくお待ち下さい</>
                  ) : (
                    <>注文を確定する</>
                  )}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
