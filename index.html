<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>なないろ菜・マイクロハーブ 発注システム</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ★LIFF SDKを読み込む -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nanairo': { light: '#e6f4ea', DEFAULT: '#4ade80', dark: '#16a34a' },
                        'nanairo-accent': '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body {
            -ms-overflow-style: none; scrollbar-width: none;
            background-color: #f3f4f6; font-family: -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 430px; margin: 0 auto; background-color: white;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        
        /* 処理中のくるくるアニメーション */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* iPhoneの下部安全領域（タブバー用） */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ★クラッシュ防止用：アイコンを直接定義
        const Icons = {
            X: ({className, onClick}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            History: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Minus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Plus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            ShoppingCart: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.38a.5.5 0 0 0-.49-.6h-15.1"/></svg>,
            Store: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>,
            Check: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>
        };

        // ★文字化け修正：プレースホルダー画像のテキストを英語にしました
        const PRODUCTS_DATA = [
            { id: 'p1', name: 'なないろ菜', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Nanairo` },
            { id: 'p2', name: 'デトロイト', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Detroit` },
            { id: 'p3', name: 'アマランサス', price: 400, unit: 'P', stock: '残りわずか', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Amaranth` },
            { id: 'p4', name: 'レッドラディッシュ', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Radish` },
            { id: 'p5', name: '青じそ', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Aojiso` },
            { id: 'p6', name: '赤じそ', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Akajiso` },
            { id: 'p7', name: 'ひまわり', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Sunflower` },
            { id: 'p8', name: 'レッドケール', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Kale` },
            { id: 'p9', name: 'ペッパークレス', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Cress` },
            { id: 'p10', name: 'マスタード', price: 400, unit: 'P', stock: '残りわずか', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Mustard` },
            { id: 'p11', name: 'ロケット', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Rocket` },
            { id: 'p12', name: 'にんじん', price: 400, unit: 'P', stock: 'あり', image: `https://placehold.co/400x300/e6f4ea/16a34a?text=Carrot` },
        ];

        function App() {
            const [userName, setUserName] = useState("読み込み中...");
            const [userId, setUserId] = useState("");
            const [isLiffReady, setIsLiffReady] = useState(false);

            const [activeTab, setActiveTab] = useState('home');
            const [pastOrders, setPastOrders] = useState([]);

            const [cart, setCart] = useState({});
            const [showConfirm, setShowConfirm] = useState(false);
            const [showComplete, setShowComplete] = useState(false);
            
            const [pickupDate, setPickupDate] = useState("");
            const [pickupTime, setPickupTime] = useState("11:00-12:00");
            const [memo, setMemo] = useState("");
            
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const savedHistory = JSON.parse(localStorage.getItem('nanairo_history') || '[]');
                setPastOrders(savedHistory);

                const today = new Date().toISOString().split('T')[0];
                setPickupDate(today);

                liff.init({ liffId: "2010021938-R9EhB5rj" })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                setUserName(profile.displayName);
                                setUserId(profile.userId);
                                setIsLiffReady(true);
                            });
                        } else {
                            if (liff.isInClient()) {
                                liff.login();
                            } else {
                                setUserName("プレビューゲスト");
                                setIsLiffReady(true);
                            }
                        }
                    })
                    .catch(err => {
                        console.error('LIFF init failed', err);
                        setUserName("ゲスト(エラー)");
                        setIsLiffReady(true);
                    });
            }, []);

            const updateQuantity = (productId, delta) => {
                setCart(prev => {
                    const next = Math.max(0, (prev[productId] || 0) + delta);
                    const newCart = { ...prev };
                    if (next === 0) delete newCart[productId];
                    else newCart[productId] = next;
                    return newCart;
                });
            };

            const setQuantity = (productId, amount) => setCart(prev => ({ ...prev, [productId]: amount }));

            const cartSummary = useMemo(() => {
                let totalItems = 0, totalPrice = 0;
                Object.entries(cart).forEach(([id, quantity]) => {
                    const product = PRODUCTS_DATA.find(p => p.id === id);
                    if (product) { totalItems += quantity; totalPrice += product.price * quantity; }
                });
                return { totalItems, totalPrice };
            }, [cart]);

            const copyFromHistory = (items) => { 
                setCart(items); 
                setActiveTab('home'); 
            };

            const handleOrderSubmit = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);

                const orderItemsString = Object.entries(cart).map(([id, qty]) => {
                    const p = PRODUCTS_DATA.find(p => p.id === id);
                    return `${p.name} × ${qty}`;
                }).join('\n');

                const payload = {
                    userName: userName,
                    userId: userId,
                    orderItems: orderItemsString,
                    pickupDate: pickupDate,
                    pickupTime: pickupTime,
                    memo: memo || "なし",
                    totalPrice: cartSummary.totalPrice
                };

                try {
                    const gasUrl = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 
                    await fetch(gasUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    
                    const newHistory = [{
                        id: Date.now(),
                        date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute:'2-digit' }),
                        items: cart
                    }, ...pastOrders].slice(0, 20);
                    
                    localStorage.setItem('nanairo_history', JSON.stringify(newHistory));
                    setPastOrders(newHistory);

                    setShowConfirm(false);
                    setShowComplete(true);
                    setCart({});
                } catch (error) {
                    console.error("送信エラー:", error);
                    alert("送信に失敗しました。電波の良いところで再度お試しください。");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const closeApp = () => {
                if (liff.isInClient()) { liff.closeWindow(); }
            };

            return (
                <div className="app-container pb-14">
                    
                    <header className="sticky top-0 z-20 bg-nanairo-light px-4 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-white font-bold text-xs">LINE</div>
                            <span className="font-bold text-gray-800 text-sm">なないろ菜・マイクロハーブ</span>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto bg-white px-4 py-4 space-y-4">
                        {activeTab === 'home' ? (
                            <>
                                <div className="flex justify-between items-end border-b border-gray-200 pb-2 mb-2">
                                    <h2 className="text-lg font-bold text-gray-800">{userName}様</h2>
                                    <span className="text-sm text-gray-600">本日のご注文</span>
                                </div>

                                <section>
                                    <h3 className="font-bold text-gray-800 mb-3">商品一覧</h3>
                                    <div className="grid grid-cols-2 gap-3 pb-20">
                                        {PRODUCTS_DATA.map(product => {
                                            const qty = cart[product.id] || 0;
                                            const isLowStock = product.stock === '残りわずか';
                                            return (
                                                <div key={product.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
                                                    <div className="relative h-28 bg-gray-100"><img src={product.image} alt={product.name} className="w-full h-full object-cover" /></div>
                                                    <div className="p-2 flex-1 flex flex-col">
                                                        <h4 className="text-sm font-bold text-gray-800 leading-tight mb-1 line-clamp-2">{product.name}</h4>
                                                        <div className="flex justify-between items-baseline mt-auto">
                                                            <span className="font-bold text-gray-900">¥{product.price}</span>
                                                            <span className="text-xs text-gray-500">/{product.unit}</span>
                                                        </div>
                                                        <div className="text-xs mt-1 font-medium">在庫: <span className={isLowStock ? 'text-nanairo-accent' : 'text-gray-600'}>{product.stock}</span></div>
                                                        <div className="mt-2 h-8">
                                                            {qty === 0 ? (
                                                                <button onClick={() => setQuantity(product.id, 1)} className={`w-full h-full rounded-md text-sm font-bold transition-colors ${isLowStock ? 'bg-orange-100 text-nanairo-accent' : 'bg-nanairo-dark text-white'}`}>カートに追加</button>
                                                            ) : (
                                                                <div className="flex items-center justify-between bg-gray-100 rounded-md h-full px-1">
                                                                    <button onClick={() => updateQuantity(product.id, -1)} className="w-8 h-full flex items-center justify-center text-gray-600 active:bg-gray-200 rounded"><Icons.Minus className="w-4 h-4" /></button>
                                                                    <span className="font-bold text-sm w-6 text-center">{qty}</span>
                                                                    <button onClick={() => updateQuantity(product.id, 1)} className="w-8 h-full flex items-center justify-center text-gray-600 active:bg-gray-200 rounded"><Icons.Plus className="w-4 h-4" /></button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            </>
                        ) : (
                            <div className="pb-20">
                                <h2 className="font-bold text-lg text-gray-800 mb-4 flex items-center gap-2">
                                    <Icons.History className="w-5 h-5 text-nanairo-dark" />過去の注文履歴
                                </h2>
                                <div className="space-y-3">
                                    {pastOrders.length === 0 ? (
                                        <p className="text-gray-500 text-center py-10 bg-gray-50 rounded-xl">履歴はありません</p>
                                    ) : pastOrders.map(order => {
                                        let total = 0;
                                        return (
                                            <div key={order.id} className="border border-gray-200 rounded-xl p-4 bg-gray-50 shadow-sm">
                                                <div className="text-xs text-gray-500 mb-1">{order.date} 注文</div>
                                                <ul className="text-sm text-gray-800 font-medium space-y-1 mb-3">
                                                    {Object.entries(order.items).map(([id, qty]) => {
                                                        const p = PRODUCTS_DATA.find(p => p.id === id);
                                                        if (p) total += p.price * qty;
                                                        return p ? <li key={id}>{p.name} × {qty}</li> : null;
                                                    })}
                                                </ul>
                                                <div className="flex justify-between items-end pt-3 border-t border-gray-200">
                                                    <span className="font-bold text-gray-900">¥{total.toLocaleString()}</span>
                                                    <button onClick={() => copyFromHistory(order.items)} className="bg-nanairo-dark text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm active:bg-green-700">再注文する</button>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {cartSummary.totalItems > 0 && !showConfirm && !showComplete && (
                        <div className="fixed bottom-14 w-full max-w-[430px] p-3 z-30 animate-slide-up pb-safe left-1/2 -translate-x-1/2">
                            <button onClick={() => setShowConfirm(true)} className="w-full bg-[#759fbf] text-white rounded-xl py-3 px-4 flex justify-between items-center font-bold shadow-lg active:bg-[#5c809a] transition-colors">
                                <div className="flex items-center gap-2"><Icons.ShoppingCart className="w-5 h-5" /><span>カートを確認する</span></div>
                                <div className="flex items-center gap-3"><span className="text-sm font-normal">{cartSummary.totalItems}点</span><span className="text-lg">¥{cartSummary.totalPrice.toLocaleString()}</span></div>
                            </button>
                        </div>
                    )}

                    <div className="fixed bottom-0 w-full max-w-[430px] bg-white border-t border-gray-200 flex h-14 z-20 pb-safe left-1/2 -translate-x-1/2">
                        <button onClick={() => setActiveTab('home')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 ${activeTab === 'home' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.Store className="w-5 h-5" />
                            <span className="text-[10px] font-bold">ショップ</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 ${activeTab === 'history' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.History className="w-5 h-5" />
                            <span className="text-[10px] font-bold">注文履歴</span>
                        </button>
                    </div>

                    {/* ★真っ白問題解消：fixed と items-center でどんなスクロール位置でも画面ぴったりに表示させます */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-black/50 z-40 flex flex-col justify-end items-center">
                            <div className="bg-white rounded-t-2xl w-full max-w-[430px] max-h-[90vh] flex flex-col animate-slide-up">
                                <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                    <h2 className="font-bold text-base flex items-center gap-2"><Icons.ShoppingCart className="w-5 h-5" />ご注文内容</h2>
                                    <button onClick={() => setShowConfirm(false)} className="p-1 bg-gray-100 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="overflow-y-auto p-4 flex-1">
                                    <div className="space-y-2 bg-gray-50 p-3 rounded-lg border border-gray-100 mb-3">
                                        {Object.entries(cart).map(([id, qty]) => {
                                            const p = PRODUCTS_DATA.find(p => p.id === id);
                                            return (
                                                <div key={id} className="flex justify-between items-center border-b border-gray-200 last:border-0 pb-2 last:pb-0">
                                                    <div>
                                                        <p className="font-bold text-sm text-gray-800">{p.name}</p>
                                                        <p className="text-xs text-gray-500">¥{p.price} × {qty}{p.unit}</p>
                                                    </div>
                                                    <p className="font-bold text-gray-900">¥{(p.price * qty).toLocaleString()}</p>
                                                </div>
                                            );
                                        })}
                                        <div className="flex justify-between items-end pt-2 mt-1 border-t border-gray-200">
                                            <span className="font-bold text-gray-600 text-sm">合計 (税込)</span>
                                            <span className="text-xl font-bold text-nanairo-dark">¥{cartSummary.totalPrice.toLocaleString()}</span>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 mb-1">ご来店予定日 <span className="text-red-500">*</span></label>
                                            <input type="date" value={pickupDate} onChange={(e) => setPickupDate(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-nanairo-dark outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 mb-1">ご来店時間帯 <span className="text-red-500">*</span></label>
                                            <select value={pickupTime} onChange={(e) => setPickupTime(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-nanairo-dark outline-none bg-white">
                                                <option value="11:00-12:00">11:00 - 12:00</option><option value="12:00-13:00">12:00 - 13:00</option><option value="13:00-14:00">13:00 - 14:00</option><option value="14:00-15:00">14:00 - 15:00</option><option value="15:00-16:00">15:00 - 16:00</option><option value="16:00-17:00">16:00 - 17:00</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 mb-1">備考欄 (任意)</label>
                                            <textarea value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="ご要望があればご記入ください" className="w-full border border-gray-300 rounded-lg p-2 text-sm h-16 resize-none focus:ring-2 focus:ring-nanairo-dark outline-none"></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-3 border-t sticky bottom-0 bg-white shrink-0 pb-safe">
                                    <button 
                                        onClick={handleOrderSubmit} 
                                        disabled={!pickupDate || isSubmitting} 
                                        className={`w-full rounded-xl py-3 font-bold text-base shadow-lg transition-colors flex justify-center items-center gap-2
                                            ${!pickupDate ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 
                                              isSubmitting ? 'bg-gray-400 text-white cursor-not-allowed' : 'bg-nanairo-dark text-white active:bg-green-700'}`}
                                    >
                                        {isSubmitting ? (
                                            <><div className="spinner"></div> 処理中...</>
                                        ) : !pickupDate ? (
                                            '来店予定日を入力してください'
                                        ) : (
                                            'この内容で予約する'
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ★真っ白問題解消：完了画面も fixed と items-center で画面中央に固定します */}
                    {showComplete && (
                        <div className="fixed inset-0 z-50 flex justify-center bg-gray-50">
                            <div className="w-full max-w-[430px] bg-white h-full flex flex-col items-center justify-center p-6 text-center pb-safe">
                                <div className="w-20 h-20 bg-green-100 text-nanairo-dark rounded-full flex items-center justify-center mb-6"><Icons.Check className="w-10 h-10" /></div>
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">ご注文完了しました</h2>
                                <p className="text-gray-600 mb-2 text-sm">公式LINEへ内容を通知しました。<br/>ご来店をお待ちしております。</p>
                                <div className="bg-gray-50 p-4 rounded-lg w-full mb-8">
                                    <p className="text-xs text-gray-500 mb-1">【お受け取り日時】</p>
                                    <p className="font-bold text-gray-800">{pickupDate} {pickupTime}</p>
                                </div>
                                <button onClick={closeApp} className="w-full bg-gray-800 text-white rounded-xl py-4 font-bold text-lg active:bg-gray-900">トーク画面に戻る</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
