<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>なないろ菜・マイクロハーブ 発注システム</title>
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- ★ここを修正しました（@7 を追加して安定版に固定） -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nanairo': { light: '#e6f4ea', DEFAULT: '#4ade80', dark: '#16a34a' },
                        'nanairo-accent': '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body {
            -ms-overflow-style: none; scrollbar-width: none;
            background-color: #f3f4f6; font-family: -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 430px; margin: 0 auto; background-color: white;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icons = {
            X: ({className, onClick}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            History: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Plus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            ShoppingCart: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.38a.5.5 0 0 0-.49-.6h-15.1"/></svg>,
            Store: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>,
            Check: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            AlertCircle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Info: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        const IMAGE_MAP = {
            "アマランサス": "https://i.imgur.com/LCmD4Pd.jpeg",
            "デトロイト": "https://i.imgur.com/YOWKgpT.jpeg",
            "なないろ菜": "https://i.imgur.com/FlH5haw.jpeg",
            "にんじん": "https://i.imgur.com/TtUZCjB.jpeg",
            "ハーブミックス": "https://i.imgur.com/DwXHahe.jpeg",
            "ひまわり": "https://i.imgur.com/TClqEi4.jpeg",
            "ペッパークレス": "https://i.imgur.com/C2HhXX7.jpeg",
            "マスタード": "https://i.imgur.com/3OsrLaG.jpeg",
            "レッドケール": "https://i.imgur.com/1leRg6v.jpeg",
            "レッドラディッシュ": "https://i.imgur.com/qLzbZzV.jpeg",
            "ロケット": "https://i.imgur.com/qYRy12U.jpeg",
            "青じそ": "https://i.imgur.com/IywcF1I.jpeg"
        };

        function App() {
            const [userName, setUserName] = useState("読み込み中...");
            const [userId, setUserId] = useState("");
            const [isLiffReady, setIsLiffReady] = useState(false);

            const [activeTab, setActiveTab] = useState('home');
            const [pastOrders, setPastOrders] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);

            const [productsData, setProductsData] = useState([]);
            const [isLoadingData, setIsLoadingData] = useState(true);

            const [cart, setCart] = useState({});
            const [showConfirm, setShowConfirm] = useState(false);
            const [showComplete, setShowComplete] = useState(false);
            
            const [cancelTarget, setCancelTarget] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);
            
            const [pickupDate, setPickupDate] = useState("");
            const [pickupTime, setPickupTime] = useState("11:00-12:00");
            const [memo, setMemo] = useState("");
            
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                setPickupDate(today);

                const savedHistory = JSON.parse(localStorage.getItem('nanairo_history') || '[]');
                setPastOrders(savedHistory);

                liff.init({ liffId: "2010021938-R9EhB5rj" })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                setUserName(profile.displayName);
                                setUserId(profile.userId);
                                setIsLiffReady(true);
                                fetchUserOrders(profile.userId); 
                            });
                        } else {
                            if (liff.isInClient()) {
                                liff.login();
                            } else {
                                setUserName("プレビューゲスト");
                                setUserId("guest_user_id");
                                setIsLiffReady(true);
                                fetchUserOrders("guest_user_id");
                            }
                        }
                    })
                    .catch(err => {
                        console.error('LIFF init failed', err);
                        setUserName("ゲスト(エラー)");
                        setIsLiffReady(true);
                    });

                fetch(`${GAS_URL}?action=getProducts`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            const formattedData = data.map(p => ({
                                ...p,
                                unit: 'P',
                                image: IMAGE_MAP[p.name] || `https://placehold.co/400x300/e6f4ea/16a34a?text=${encodeURIComponent(p.name)}`
                            }));
                            setProductsData(formattedData);
                        }
                    })
                    .catch(err => console.error("データ取得エラー", err))
                    .finally(() => setIsLoadingData(false));
            }, []);

            const fetchUserOrders = (uid) => {
                setIsLoadingHistory(true);
                fetch(`${GAS_URL}?action=getUserOrders&userId=${uid}`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            setPastOrders(data);
                            localStorage.setItem('nanairo_history', JSON.stringify(data));
                        }
                    })
                    .catch(err => console.error("履歴取得エラー", err))
                    .finally(() => setIsLoadingHistory(false));
            };

            const updateQuantity = (productId, delta) => {
                setCart(prev => {
                    const next = Math.max(0, (prev[productId] || 0) + delta);
                    const newCart = { ...prev };
                    if (next === 0) delete newCart[productId];
                    else newCart[productId] = next;
                    return newCart;
                });
            };

            const setQuantity = (productId, amount) => setCart(prev => ({ ...prev, [productId]: amount }));

            const cartSummary = useMemo(() => {
                let totalItems = 0, totalPrice = 0;
                Object.entries(cart).forEach(([id, quantity]) => {
                    const product = productsData.find(p => p.id === id);
                    if (product) { totalItems += quantity; totalPrice += product.price * quantity; }
                });
                return { totalItems, totalPrice };
            }, [cart, productsData]);

            const copyFromHistory = (itemsList) => { 
                const newCart = {};
                if (Array.isArray(itemsList)) {
                    itemsList.forEach(item => {
                        const product = productsData.find(p => p.name === item.name);
                        if (product) newCart[product.id] = item.qty;
                    });
                }
                setCart(newCart); 
                setActiveTab('home'); 
            };

            const handleOrderSubmit = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);

                const orderItemsString = Object.entries(cart).map(([id, qty]) => {
                    const p = productsData.find(p => p.id === id);
                    return `${p.name} × ${qty}`;
                }).join('\n');

                const payload = {
                    action: "order", 
                    userName: userName,
                    userId: userId,
                    orderItems: orderItemsString,
                    pickupDate: pickupDate,
                    pickupTime: pickupTime,
                    memo: memo || "なし",
                    totalPrice: cartSummary.totalPrice
                };

                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    
                    if(userId) fetchUserOrders(userId);

                    setShowConfirm(false);
                    setShowComplete(true);
                    setCart({});
                } catch (error) {
                    console.error("送信エラー:", error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleCancelOrder = async () => {
                if (!cancelTarget || isCancelling) return;
                setIsCancelling(true);
                
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "cancelOrder",
                            orderId: cancelTarget.id,
                            userId: userId
                        })
                    });
                    
                    const newOrders = pastOrders.map(o => 
                        o.id === cancelTarget.id ? { ...o, status: 'キャンセル' } : o
                    );
                    setPastOrders(newOrders);
                    localStorage.setItem('nanairo_history', JSON.stringify(newOrders));
                    
                    setCancelTarget(null);
                } catch (error) {
                    console.error("キャンセルエラー:", error);
                } finally {
                    setIsCancelling(false);
                }
            };

            const closeApp = () => {
                if (liff.isInClient()) { liff.closeWindow(); }
            };

            return (
                <div className="app-container pb-14">
                    
                    <header className="sticky top-0 z-20 bg-nanairo-light px-4 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-white font-bold text-xs">LINE</div>
                            <span className="font-bold text-gray-800 text-sm">なないろ菜・マイクロハーブ</span>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto bg-white px-4 py-4 space-y-4">
                        {activeTab === 'home' ? (
                            <>
                                <div className="flex justify-between items-end border-b border-gray-200 pb-2 mb-2">
                                    <h2 className="text-lg font-bold text-gray-800">{userName}様</h2>
                                    <span className="text-sm text-gray-600">本日のご注文</span>
                                </div>

                                <section>
                                    <h3 className="font-bold text-gray-800 mb-3">商品一覧</h3>
                                    
                                    {isLoadingData ? (
                                        <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                                            <div className="spinner mb-2 border-l-nanairo-dark"></div>
                                            <p className="text-xs font-bold">商品データを読み込み中...</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3 pb-20">
                                            {productsData.map(product => {
                                                const qty = cart[product.id] || 0;
                                                const isLowStock = product.stock > 0 && product.stock <= 5;
                                                const isSoldOut = product.stock <= 0;

                                                return (
                                                    <div key={product.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm flex flex-col relative">
                                                        {isSoldOut && (
                                                            <div className="absolute inset-0 bg-white/60 backdrop-blur-[1px] z-10 flex items-center justify-center">
                                                                <span className="bg-gray-800 text-white font-bold px-3 py-1.5 rounded text-sm tracking-widest -rotate-12 shadow-lg">SOLD OUT</span>
                                                            </div>
                                                        )}
                                                        <div className="relative h-28 bg-gray-100">
                                                            <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                                                        </div>
                                                        <div className="p-2 flex-1 flex flex-col">
                                                            <h4 className="text-sm font-bold text-gray-800 leading-tight mb-1 line-clamp-2">{product.name}</h4>
                                                            
                                                            <div className="mb-2">
                                                                <span className="text-[10px] font-bold text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">内容量: {product.weight}</span>
                                                            </div>

                                                            <div className="flex justify-between items-baseline mt-auto">
                                                                <span className="font-bold text-gray-900">¥{product.price}</span>
                                                                <span className="text-xs text-gray-500">/{product.unit}</span>
                                                            </div>
                                                            <div className="text-xs mt-1 font-medium flex justify-between">
                                                                <span>在庫: <span className={isSoldOut ? 'text-red-500 font-bold' : isLowStock ? 'text-nanairo-accent' : 'text-gray-600'}>{isSoldOut ? 'なし' : product.stock + 'P'}</span></span>
                                                            </div>
                                                            <div className="mt-2 h-8">
                                                                {qty === 0 ? (
                                                                    <button onClick={() => setQuantity(product.id, 1)} disabled={isSoldOut} className={`w-full h-full rounded-md text-sm font-bold transition-colors ${isSoldOut ? 'bg-gray-200 text-gray-400' : isLowStock ? 'bg-orange-100 text-nanairo-accent' : 'bg-nanairo-dark text-white'}`}>カートに追加</button>
                                                                ) : (
                                                                    <div className="flex items-center justify-between bg-gray-100 rounded-md h-full px-1 z-20 relative">
                                                                        <button onClick={() => updateQuantity(product.id, -1)} className="w-8 h-full flex items-center justify-center text-gray-600 active:bg-gray-200 rounded"><Icons.Minus className="w-4 h-4" /></button>
                                                                        <span className="font-bold text-sm w-6 text-center">{qty}</span>
                                                                        <button onClick={() => updateQuantity(product.id, 1)} disabled={qty >= product.stock} className={`w-8 h-full flex items-center justify-center rounded ${qty >= product.stock ? 'text-gray-300' : 'text-gray-600 active:bg-gray-200'}`}><Icons.Plus className="w-4 h-4" /></button>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </section>
                            </>
                        ) : (
                            <div className="pb-20">
                                {/* ★変更: タイトルの変更と注意書きの追加 */}
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="font-bold text-lg text-gray-800 flex items-center gap-2">
                                        <Icons.History className="w-5 h-5 text-nanairo-dark" />履歴・キャンセル
                                    </h2>
                                    {isLoadingHistory && <div className="spinner border-l-nanairo-dark w-4 h-4"></div>}
                                </div>
                                
                                <div className="bg-gray-50 border border-gray-200 rounded-lg p-2.5 mb-4 flex gap-2 items-start">
                                    <Icons.Info className="w-4 h-4 text-gray-400 shrink-0 mt-0.5" />
                                    <p className="text-[10px] text-gray-500 leading-relaxed">
                                        「準備完了」「受渡済」となったご注文はシステムからキャンセルできません。変更がある場合は直接お電話にてご連絡ください。
                                    </p>
                                </div>
                                
                                <div className="space-y-3">
                                    {pastOrders.length === 0 ? (
                                        <p className="text-gray-500 text-center py-10 bg-gray-50 rounded-xl">履歴はありません</p>
                                    ) : pastOrders.map(order => {
                                        const isCancelled = order.status === 'キャンセル';
                                        const isCompleted = order.status === '受渡済';
                                        const isCancellable = order.status === '未対応'; // キャンセル可能な条件
                                        
                                        return (
                                            <div key={order.id} className={`border rounded-xl p-4 shadow-sm relative overflow-hidden ${isCancelled ? 'bg-gray-100 border-gray-200 opacity-70' : 'bg-white border-gray-200'}`}>
                                                
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="text-xs text-gray-500">{order.orderDate} 注文</div>
                                                    <div className={`text-[10px] font-bold px-2 py-1 rounded-full ${
                                                        isCancelled ? 'bg-gray-300 text-gray-600' :
                                                        isCompleted ? 'bg-gray-800 text-white' :
                                                        order.status === '未対応' ? 'bg-red-100 text-red-600' :
                                                        'bg-nanairo-dark text-white'
                                                    }`}>
                                                        {order.status}
                                                    </div>
                                                </div>
                                                
                                                <ul className={`text-sm font-medium space-y-1 mb-3 ${isCancelled ? 'text-gray-500 line-through' : 'text-gray-800'}`}>
                                                    {order.itemsList && order.itemsList.map((item, idx) => (
                                                        <li key={idx}>{item.name} × {item.qty}</li>
                                                    ))}
                                                </ul>
                                                
                                                <div className="flex justify-between items-end pt-3 border-t border-gray-200">
                                                    <span className={`font-bold ${isCancelled ? 'text-gray-500' : 'text-gray-900'}`}>
                                                        ¥{(order.totalPrice || 0).toLocaleString()}
                                                    </span>
                                                    
                                                    <div className="flex gap-2">
                                                        {isCancellable && (
                                                            <button onClick={() => setCancelTarget(order)} className="text-red-500 border border-red-300 bg-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm active:bg-red-50 transition-colors">
                                                                キャンセル
                                                            </button>
                                                        )}
                                                        <button onClick={() => copyFromHistory(order.itemsList)} className="bg-nanairo-dark text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm active:bg-green-700 transition-colors">
                                                            再注文
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* カート下部バー */}
                    {cartSummary.totalItems > 0 && !showConfirm && !showComplete && (
                        <div className="fixed bottom-14 left-0 right-0 mx-auto w-full max-w-[430px] px-4 py-3 z-30 animate-slide-up pb-safe box-border">
                            <button onClick={() => setShowConfirm(true)} className="w-full bg-[#759fbf] text-white rounded-xl py-3 px-4 flex justify-between items-center font-bold shadow-lg active:bg-[#5c809a] transition-colors">
                                <div className="flex items-center gap-2"><Icons.ShoppingCart className="w-5 h-5" /><span>カートを確認する</span></div>
                                <div className="flex items-center gap-3"><span className="text-sm font-normal">{cartSummary.totalItems}点</span><span className="text-lg">¥{cartSummary.totalPrice.toLocaleString()}</span></div>
                            </button>
                        </div>
                    )}

                    {/* ★変更: タブナビゲーションのラベルを変更 */}
                    <div className="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[430px] bg-white border-t border-gray-200 flex h-14 z-20 pb-safe box-border">
                        <button onClick={() => setActiveTab('home')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 ${activeTab === 'home' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.Store className="w-5 h-5" />
                            <span className="text-[10px] font-bold">ショップ</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 ${activeTab === 'history' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.History className="w-5 h-5" />
                            <span className="text-[10px] font-bold">履歴・キャンセル</span>
                        </button>
                    </div>

                    {/* 注文確認モーダル */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-black/50 z-40 flex flex-col justify-end items-center">
                            <div className="bg-white rounded-t-2xl w-full max-w-[430px] max-h-[90vh] flex flex-col animate-slide-up">
                                <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                    <h2 className="font-bold text-base flex items-center gap-2"><Icons.ShoppingCart className="w-5 h-5" />ご注文内容</h2>
                                    <button onClick={() => setShowConfirm(false)} className="p-1 bg-gray-100 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="overflow-y-auto p-4 flex-1">
                                    <div className="space-y-2 bg-gray-50 p-3 rounded-lg border border-gray-100 mb-3">
                                        {Object.entries(cart).map(([id, qty]) => {
                                            const p = productsData.find(p => p.id === id);
                                            return (
                                                <div key={id} className="flex justify-between items-center border-b border-gray-200 last:border-0 pb-2 last:pb-0">
                                                    <div>
                                                        <p className="font-bold text-sm text-gray-800">{p.name} <span className="text-[10px] font-normal text-gray-500 bg-gray-100 px-1 rounded ml-1">{p.weight}</span></p>
                                                        <p className="text-xs text-gray-500">¥{p.price} × {qty}{p.unit}</p>
                                                    </div>
                                                    <p className="font-bold text-gray-900">¥{(p.price * qty).toLocaleString()}</p>
                                                </div>
                                            );
                                        })}
                                        <div className="flex justify-between items-end pt-2 mt-1 border-t border-gray-200">
                                            <span className="font-bold text-gray-600 text-sm">合計 (税込)</span>
                                            <span className="text-xl font-bold text-nanairo-dark">¥{cartSummary.totalPrice.toLocaleString()}</span>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 mb-1">ご来店予定日 <span className="text-red-500">*</span></label>
                                            <input type="date" value={pickupDate} onChange={(e) => setPickupDate(e.target.value)} className="block w-full border border-gray-300 rounded-lg p-3 text-base bg-gray-50 focus:ring-2 focus:ring-nanairo-dark outline-none appearance-none box-border" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 mb-1">ご来店時間帯 <span className="text-red-500">*</span></label>
                                            <select value={pickupTime} onChange={(e) => setPickupTime(e.target.value)} className="block w-full border border-gray-300 rounded-lg p-3 text-base bg-gray-50 focus:ring-2 focus:ring-nanairo-dark outline-none appearance-none box-border">
                                                <option value="11:00-12:00">11:00 - 12:00</option><option value="12:00-13:00">12:00 - 13:00</option><option value="13:00-14:00">13:00 - 14:00</option><option value="14:00-15:00">14:00 - 15:00</option><option value="15:00-16:00">15:00 - 16:00</option><option value="16:00-17:00">16:00 - 17:00</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 mb-1">備考欄 (任意)</label>
                                            <textarea value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="ご要望があればご記入ください" className="block w-full border border-gray-300 rounded-lg p-3 text-base bg-gray-50 h-20 resize-none focus:ring-2 focus:ring-nanairo-dark outline-none appearance-none box-border"></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-3 border-t sticky bottom-0 bg-white shrink-0 pb-safe">
                                    <button 
                                        onClick={handleOrderSubmit} 
                                        disabled={!pickupDate || isSubmitting} 
                                        className={`w-full rounded-xl py-3 font-bold text-base shadow-lg transition-colors flex justify-center items-center gap-2
                                            ${!pickupDate ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 
                                              isSubmitting ? 'bg-gray-400 text-white cursor-not-allowed' : 'bg-nanairo-dark text-white active:bg-green-700'}`}
                                    >
                                        {isSubmitting ? (
                                            <><div className="spinner"></div> 処理中...</>
                                        ) : !pickupDate ? (
                                            '来店予定日を入力してください'
                                        ) : (
                                            'この内容で予約する'
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* キャンセル確認モーダル */}
                    {cancelTarget && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3">
                                        <Icons.AlertCircle className="w-7 h-7" />
                                    </div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">注文をキャンセルしますか？</h3>
                                    <p className="text-xs text-gray-500">この操作は元に戻せません。<br/>在庫はシステムに返却されます。</p>
                                </div>
                                
                                <div className="bg-gray-50 rounded-lg p-3 text-xs text-gray-700 font-medium border border-gray-200 mb-5">
                                    <div>受取予定: {cancelTarget.pickupDate} {cancelTarget.pickupTime}</div>
                                    <div className="mt-1 line-clamp-2 text-gray-500">
                                        {cancelTarget.itemsList?.map(i => `${i.name}×${i.qty}`).join(', ')}
                                    </div>
                                </div>
                                
                                <div className="flex gap-2">
                                    <button onClick={() => setCancelTarget(null)} disabled={isCancelling} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">
                                        閉じる
                                    </button>
                                    <button onClick={handleCancelOrder} disabled={isCancelling} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">
                                        {isCancelling ? <div className="spinner border-l-white w-4 h-4"></div> : 'キャンセル'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 完了画面 */}
                    {showComplete && (
                        <div className="fixed inset-0 z-50 flex justify-center bg-gray-50">
                            <div className="w-full max-w-[430px] bg-white h-full flex flex-col items-center justify-center p-6 text-center pb-safe">
                                <div className="w-20 h-20 bg-green-100 text-nanairo-dark rounded-full flex items-center justify-center mb-6"><Icons.Check className="w-10 h-10" /></div>
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">ご注文完了しました</h2>
                                <p className="text-gray-600 mb-2 text-sm">公式LINEへ内容を通知しました。<br/>ご来店をお待ちしております。</p>
                                <button onClick={closeApp} className="w-full bg-gray-800 text-white rounded-xl py-4 font-bold text-lg active:bg-gray-900 mt-8">トーク画面に戻る</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
