<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【管理者用】なないろ菜 ダッシュボード</title>
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nanairo': { light: '#e6f4ea', DEFAULT: '#4ade80', dark: '#16a34a' },
                        'nanairo-accent': '#f97316',
                        'line': '#06C755'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body {
            background-color: #f3f4f6; font-family: -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 600px; margin: 0 auto; background-color: #f3f4f6;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
        }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Plus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Check: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            Box: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            ClipboardList: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            TrendingUp: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Clock: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            AlertTriangle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Users: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CreditCard: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
            Star: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Award: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            ShoppingBag: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            Calendar: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            RefreshCw: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        function App() {
            const [activeTab, setActiveTab] = useState('orders');

            // ★変更: 初期値を空配列にし、ローディング状態を追加
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [analytics, setAnalytics] = useState(null);
            
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isFetchingData, setIsFetchingData] = useState(false);

            // 在庫調整用の状態
            const [selectedProductId, setSelectedProductId] = useState('');
            const [type, setType] = useState('add'); 
            const [amount, setAmount] = useState(1);
            const [memo, setMemo] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [message, setMessage] = useState('');

            // 分析・注文表示用の月指定
            const todayMonth = new Date().toISOString().slice(0, 7);
            const [viewStartMonth, setViewStartMonth] = useState(todayMonth);
            const [viewEndMonth, setViewEndMonth] = useState(todayMonth);

            // ★追加: GASからデータを取得する関数
            const fetchData = async (monthParam) => {
                setIsFetchingData(true);
                try {
                    const response = await fetch(`${GAS_URL}?action=getAdminData&month=${monthParam}`);
                    const data = await response.json();
                    
                    if (data.status === 'error') {
                        console.error("サーバーエラー:", data.message);
                        alert("データの取得に失敗しました。");
                        return;
                    }

                    if (data.products) setProducts(data.products);
                    if (data.orders) setOrders(data.orders);
                    if (data.analytics) setAnalytics(data.analytics);
                    
                } catch (error) {
                    console.error("通信エラー:", error);
                    alert("通信エラーが発生しました。");
                } finally {
                    setIsLoadingData(false);
                    setIsFetchingData(false);
                }
            };

            // 初回読み込みと、月を変更した時の読み込み
            useEffect(() => {
                // startMonth を基準にしてデータを引っ張る（必要に応じて複数月の処理を追加可能）
                fetchData(viewStartMonth);
            }, [viewStartMonth]);

            // 手動更新ボタン
            const handleRefresh = () => {
                fetchData(viewStartMonth);
            };

            // アクションボタン処理
            const handleActionClick = (productId, actionType) => {
                setSelectedProductId(productId);
                setType(actionType);
                setAmount(1);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };

            // ★変更: スプレッドシート（GAS）へ在庫調整を送信
            const handleSubmitStock = async () => {
                if (!selectedProductId) return alert("商品を選択してください");
                setIsSubmitting(true);
                
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "stockUpdate",
                            productId: selectedProductId,
                            type: type,
                            amount: amount,
                            memo: memo
                        })
                    });

                    setMessage(`${amount}件の${type === 'add' ? '追加' : '破棄'}を記録しました！`);
                    setTimeout(() => setMessage(''), 3000);
                    
                    // 成功したら画面のデータも最新にする
                    fetchData(viewStartMonth);
                    
                    setAmount(1); 
                    setMemo(''); 
                } catch(error) {
                    alert("エラーが発生しました。");
                    console.error(error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            // ★変更: スプレッドシート（GAS）へ注文ステータス変更を送信
            const toggleOrderStatus = async (orderId, currentStatus) => {
                const nextStatus = currentStatus === '未対応' ? '準備完了' : currentStatus === '準備完了' ? '受渡済' : '未対応';
                
                // 画面上を先に更新してサクサク動かす（オプティミスティックUI）
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));

                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "statusUpdate",
                            orderId: orderId,
                            newStatus: nextStatus
                        })
                    });
                } catch(error) {
                    alert("ステータス更新に失敗しました。");
                    // 失敗したら元に戻す
                    setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: currentStatus } : o));
                }
            };

            if (isLoadingData) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-f3f4f6 text-gray-500">
                        <div className="spinner mb-4 border-l-nanairo-dark"></div>
                        <p className="font-bold">最新データを同期中...</p>
                    </div>
                );
            }

            // ==========================================
            // UIコンポーネント: 1. 注文管理タブ
            // ==========================================
            const OrdersTab = () => {
                const isCurrentMonth = viewStartMonth === todayMonth;
                const activeOrders = orders.filter(o => o.status !== '受渡済');
                
                // 今月の場合は「受渡済」のうち今月のもの。過去月の場合はその月の「受渡済」のもの。
                const pastOrders = isCurrentMonth 
                    ? orders.filter(o => o.status === '受渡済' && o.orderDate && o.orderDate.startsWith(todayMonth))
                    : orders.filter(o => o.status === '受渡済' && o.orderDate && o.orderDate.startsWith(viewStartMonth));

                return (
                    <div className="animate-slide-up space-y-5">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm w-fit">
                                <Icons.Calendar className="w-4 h-4 text-gray-500" />
                                <input 
                                    type="month" 
                                    value={viewStartMonth} 
                                    onChange={(e) => setViewStartMonth(e.target.value)}
                                    className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer"
                                />
                            </div>
                            <button onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full shadow-sm text-gray-500 active:bg-gray-100">
                                <Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} />
                            </button>
                        </div>

                        {isCurrentMonth && (
                            <>
                                <div className="flex justify-between items-end border-l-4 border-nanairo-dark pl-2">
                                    <h1 className="text-xl font-bold text-gray-800">注文対応</h1>
                                    <span className="text-sm font-bold text-nanairo-dark bg-nanairo-light px-2 py-1 rounded">未対応: {activeOrders.length}件</span>
                                </div>

                                <div className="space-y-4">
                                    {activeOrders.map(order => (
                                        <div key={order.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
                                            <div className={`px-4 py-2 flex justify-between items-center text-white font-bold text-sm ${order.status === '未対応' ? 'bg-red-500' : 'bg-nanairo-dark'}`}>
                                                <div className="flex items-center gap-1">
                                                    {order.status === '未対応' ? <Icons.Clock className="w-4 h-4"/> : <Icons.Check className="w-4 h-4"/>}
                                                    {order.status}
                                                </div>
                                                <span className="text-xs font-normal opacity-90">注文: {order.orderDate}</span>
                                            </div>

                                            <div className="p-4">
                                                <div className="flex justify-between items-start mb-3 border-b border-gray-100 pb-3">
                                            <div>
                                                <div className="font-bold text-gray-800 text-lg flex items-center gap-2">
                                                    {order.userName} 様
                                                </div>
                                                <div className="text-sm text-nanairo-dark font-bold mt-1 flex items-center gap-1">
                                                    {/* ★修正: 長すぎる日付文字列が来た場合、最初の部分(YYYY-MM-DD)だけを切り取って表示する安全装置 */}
                                                    <Icons.ShoppingBag className="w-4 h-4"/> 受取: {String(order.pickupDate).split(' ')[0]} {order.pickupTime}
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-sm text-gray-500 mb-0.5">合計金額</div>
                                                <div className="font-bold text-xl text-gray-900">¥{(order.totalPrice || 0).toLocaleString()}</div>
                                            </div>
                                        </div>
                                    ))}
                                    {activeOrders.length === 0 && (
                                        <div className="text-center py-10 bg-white rounded-xl border border-gray-200 text-gray-500">現在、未対応の注文はありません。</div>
                                    )}
                                </div>
                            </>
                        )}

                        <div className={isCurrentMonth ? "pt-4 border-t border-gray-200" : ""}>
                            <h3 className="font-bold text-gray-600 mb-3 text-sm flex items-center gap-2">
                                <Icons.ClipboardList className="w-4 h-4" /> 
                                {isCurrentMonth ? "最近の受渡済み" : `${viewStartMonth.split('-')[1]}月の受渡済み一覧`}
                            </h3>
                            
                            {pastOrders.length === 0 ? (
                                <div className="text-center py-10 bg-gray-50 rounded-xl text-gray-500 text-sm border border-gray-200">
                                    この月の履歴はありません。
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {pastOrders.map(order => (
                                        <div key={order.id} className="bg-white border border-gray-200 p-3 rounded-lg shadow-sm flex justify-between items-center opacity-80">
                                            <div>
                                                <div className="font-bold text-gray-700 text-sm mb-1">{order.userName} 様 <span className="text-xs font-normal text-gray-400 ml-2">({order.orderDate})</span></div>
                                                <div className="text-xs text-gray-500">
                                                    {order.itemsList && order.itemsList.map(i => `${i.name}×${i.qty}`).join(', ')}
                                                </div>
                                            </div>
                                            <div className="text-right flex flex-col items-end gap-1">
                                                <div className="font-bold text-sm text-gray-800">¥{(order.totalPrice || 0).toLocaleString()}</div>
                                                <button onClick={() => toggleOrderStatus(order.id, order.status)} className="text-[10px] font-bold text-gray-500 bg-gray-50 px-2 py-1 rounded border active:bg-gray-200">戻す</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ==========================================
            // UIコンポーネント: 2. 在庫調整タブ
            // ==========================================
            const InventoryTab = () => (
                <div className="animate-slide-up space-y-6">
                    <div className="flex justify-between items-end border-l-4 border-nanairo-dark pl-2">
                        <h1 className="text-xl font-bold text-gray-800">在庫管理・調整</h1>
                        <button onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full shadow-sm text-gray-500 active:bg-gray-100">
                            <Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} />
                        </button>
                    </div>

                    {message && (
                        <div className="bg-nanairo-light border border-nanairo text-nanairo-dark px-4 py-3 rounded-xl flex items-center gap-2">
                            <Icons.Check className="w-5 h-5" />
                            <span className="font-bold text-sm">{message}</span>
                        </div>
                    )}

                    <section className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th className="px-3 py-3 font-bold text-gray-600">商品名</th>
                                    <th className="px-2 py-3 font-bold text-gray-600 text-center">在庫</th>
                                    <th className="px-3 py-3 font-bold text-gray-600 text-right">調整</th>
                                </tr>
                            </thead>
                            <tbody>
                                {products.map(p => (
                                    <tr key={p.id} className="border-b border-gray-100 last:border-0">
                                        <td className="px-3 py-3 font-bold text-gray-800 whitespace-nowrap">
                                            {p.name}
                                            {p.weight && <span className="block text-[10px] text-gray-500 font-normal">{p.weight}</span>}
                                        </td>
                                        <td className="px-2 py-3 text-center">
                                            <span className={`font-bold px-2 py-1 rounded-md text-xs ${p.stock <= 5 ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {p.stock} P
                                            </span>
                                        </td>
                                        <td className="px-3 py-3 text-right">
                                            <div className="flex justify-end gap-1">
                                                <button onClick={() => handleActionClick(p.id, 'add')} className="bg-nanairo-dark text-white px-2 py-1.5 rounded text-xs font-bold active:bg-green-700">追加</button>
                                                <button onClick={() => handleActionClick(p.id, 'remove')} className="bg-red-500 text-white px-2 py-1.5 rounded text-xs font-bold active:bg-red-600">破棄</button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </section>

                    <section className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h2 className="font-bold text-gray-800 mb-4 text-base">新しい調整を登録</h2>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">商品を選択</label>
                                <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} className="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 focus:ring-2 focus:ring-nanairo-dark outline-none">
                                    <option value="">選択してください</option>
                                    {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">区分</label>
                                    <div className="flex items-center bg-gray-100 border border-gray-200 rounded-xl h-11 p-1 relative cursor-pointer" onClick={() => setType(type === 'add' ? 'remove' : 'add')}>
                                        <div className={`w-1/2 h-full rounded-lg flex items-center justify-center text-xs font-bold z-10 transition-colors ${type === 'add' ? 'text-white' : 'text-gray-500'}`}>収穫 (追加)</div>
                                        <div className={`w-1/2 h-full rounded-lg flex items-center justify-center text-xs font-bold z-10 transition-colors ${type === 'remove' ? 'text-white' : 'text-gray-500'}`}>ロス (破棄)</div>
                                        <div className={`absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-lg shadow-sm transition-transform duration-300 ${type === 'add' ? 'bg-nanairo-dark left-1 translate-x-0' : 'bg-red-500 left-1 translate-x-full'}`}></div>
                                    </div>
                                </div>
                                <div className="w-24">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">数量</label>
                                    <div className="flex items-center border border-gray-300 rounded-xl bg-gray-50 h-11 overflow-hidden">
                                        <button onClick={() => setAmount(Math.max(1, amount - 1))} className="w-8 h-full flex justify-center items-center text-gray-600 bg-gray-100"><Icons.Minus className="w-3 h-3" /></button>
                                        <div className="flex-1 text-center font-bold text-sm">{amount}</div>
                                        <button onClick={() => setAmount(amount + 1)} className="w-8 h-full flex justify-center items-center text-gray-600 bg-gray-100"><Icons.Plus className="w-3 h-3" /></button>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">メモ (オプション)</label>
                                <textarea value={memo} onChange={e => setMemo(e.target.value)} placeholder="例：鮮度落ち" className="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 h-16 resize-none focus:ring-2 focus:ring-nanairo-dark outline-none"></textarea>
                            </div>
                            <button onClick={handleSubmitStock} disabled={isSubmitting || !selectedProductId} className={`w-full py-3.5 rounded-xl font-bold shadow-md transition-colors flex justify-center items-center gap-2 mt-2 ${(!selectedProductId || isSubmitting) ? 'bg-gray-300 text-gray-500' : type === 'add' ? 'bg-nanairo-dark text-white' : 'bg-red-500 text-white'}`}>
                                {isSubmitting ? <><div className="spinner"></div> 登録中...</> : 'スプレッドシートに記録'}
                            </button>
                        </div>
                    </section>
                </div>
            );

            // ==========================================
            // UIコンポーネント: 3. 分析タブ
            // ==========================================
            const AnalyticsTab = () => {
                const formatMonth = (m) => m ? m.replace('-', '年') + '月' : '';
                const isSingleMonth = viewStartMonth === viewEndMonth;
                const periodText = isSingleMonth ? formatMonth(viewStartMonth) : `${formatMonth(viewStartMonth)} 〜 ${formatMonth(viewEndMonth)}`;
                const shortPeriodText = isSingleMonth ? `${viewStartMonth.split('-')[1]}月` : `指定期間`;

                // データがない場合の安全処理
                const anData = analytics || { monthlySales: 0, orderCount: 0, averageSpend: 0, topProducts: [] };

                return (
                    <div className="animate-slide-up space-y-5">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex flex-wrap items-center gap-2 bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm w-fit">
                                <Icons.Calendar className="w-4 h-4 text-gray-500" />
                                <input 
                                    type="month" 
                                    value={viewStartMonth} 
                                    onChange={(e) => setViewStartMonth(e.target.value)}
                                    className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer"
                                />
                                {/* 期間指定をしたい場合はここに 〜 endMonth を追加 */}
                            </div>
                            <button onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full shadow-sm text-gray-500 active:bg-gray-100">
                                <Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} />
                            </button>
                        </div>

                        <div className="flex justify-between items-end border-l-4 border-blue-600 pl-2">
                            <h1 className="text-xl font-bold text-gray-800">ダッシュボード</h1>
                            <span className="text-xs font-bold text-gray-500">{periodText}</span>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <div className="text-xs text-gray-500 font-bold mb-1 flex items-center gap-1"><Icons.TrendingUp className="w-3 h-3"/> {shortPeriodText}の売上</div>
                                <div className="text-2xl font-bold text-gray-900 tracking-tight">¥{anData.monthlySales.toLocaleString()}</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <div className="text-xs text-gray-500 font-bold mb-1 flex items-center gap-1"><Icons.ClipboardList className="w-3 h-3"/> {shortPeriodText}の注文数</div>
                                <div className="text-2xl font-bold text-gray-900 tracking-tight">{anData.orderCount} <span className="text-sm font-normal text-gray-500">件</span></div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <div className="text-xs text-gray-500 font-bold mb-1 flex items-center gap-1"><Icons.CreditCard className="w-3 h-3"/> 平均客単価</div>
                                <div className="text-xl font-bold text-gray-900 tracking-tight">¥{anData.averageSpend.toLocaleString()}</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-red-100 bg-red-50/30">
                                <div className="text-xs text-red-600 font-bold mb-1 flex items-center gap-1"><Icons.AlertTriangle className="w-3 h-3"/> 推定ロス金額</div>
                                <div className="text-xl font-bold text-red-700 tracking-tight">--</div>
                                <div className="text-[10px] text-red-500 font-bold mt-1">※集計中</div>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-700 text-sm mb-4 flex items-center gap-2"><Icons.ShoppingBag className="w-4 h-4 text-blue-500"/> {shortPeriodText}の人気商品トップ</h3>
                            <div className="space-y-4">
                                {anData.topProducts.length === 0 ? (
                                    <p className="text-sm text-gray-500 text-center py-4">データがありません</p>
                                ) : (
                                    anData.topProducts.map((p, idx) => {
                                        // 1位を基準にしてバーの長さを決める
                                        const maxQty = anData.topProducts[0].qty || 1;
                                        const percent = Math.max(10, Math.round((p.qty / maxQty) * 100));
                                        const colors = ['bg-blue-500', 'bg-blue-400', 'bg-blue-300', 'bg-gray-400', 'bg-gray-300'];
                                        return (
                                            <div key={p.name}>
                                                <div className="flex justify-between items-center mb-1">
                                                    <div className="text-sm font-bold text-gray-800 flex items-center gap-2"><span className="text-gray-400">{idx + 1}.</span> {p.name}</div>
                                                    <div className="text-sm font-bold text-gray-600">{p.qty} P</div>
                                                </div>
                                                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                    <div className={`${colors[idx] || colors[4]} h-full transition-all duration-1000`} style={{ width: `${percent}%` }}></div>
                                                </div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    <header className="sticky top-0 z-30 bg-nanairo-light px-4 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-7 h-7 bg-line rounded-full flex items-center justify-center text-white font-bold text-[9px] tracking-tighter">LINE</div>
                            <span className="font-bold text-gray-800 text-sm">なないろ菜・マイクロハーブ <span className="text-nanairo-dark text-xs ml-1">[管理]</span></span>
                        </div>
                    </header>

                    <main className="flex-1 px-4 pt-4 pb-[120px]">
                        {activeTab === 'orders' && <OrdersTab />}
                        {activeTab === 'inventory' && <InventoryTab />}
                        {activeTab === 'analytics' && <AnalyticsTab />}
                    </main>

                    <div className="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[600px] bg-white border-t border-gray-200 flex h-[60px] z-40 pb-[env(safe-area-inset-bottom)] box-border">
                        <button onClick={() => setActiveTab('orders')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'orders' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.ClipboardList className="w-6 h-6" />
                                {orders.filter(o=>o.status==='未対応').length > 0 && (
                                    <div className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white"></div>
                                )}
                            </div>
                            <span className="text-[10px] font-bold">注文対応</span>
                        </button>
                        <button onClick={() => setActiveTab('inventory')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'inventory' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.Box className="w-6 h-6" />
                            <span className="text-[10px] font-bold">在庫調整</span>
                        </button>
                        <button onClick={() => setActiveTab('analytics')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'analytics' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.TrendingUp className="w-6 h-6" />
                            <span className="text-[10px] font-bold">分析</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
