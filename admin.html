<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【管理者用】なないろ菜 ダッシュボード</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nanairo': { light: '#e6f4ea', DEFAULT: '#4ade80', dark: '#16a34a' },
                        'nanairo-accent': '#f97316',
                        'line': '#06C755'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body {
            background-color: #f3f4f6; font-family: -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 600px; margin: 0 auto; background-color: #f3f4f6;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
        }
        /* pb-safe は Tailwindのクラスで直接指定するように変更しました */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Plus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Check: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            Box: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            ClipboardList: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            TrendingUp: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Clock: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            AlertTriangle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Users: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CreditCard: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
            Star: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Award: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            ShoppingBag: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            Calendar: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        function App() {
            const [activeTab, setActiveTab] = useState('orders');

            const [products, setProducts] = useState([
                { id: 'p1', name: 'なないろ菜', stock: 15 },
                { id: 'p2', name: 'デトロイト', stock: 10 },
                { id: 'p3', name: 'アマランサス', stock: 4 },
                { id: 'p4', name: 'レッドラディッシュ', stock: 15 },
                { id: 'p5', name: '青じそ', stock: 20 },
                { id: 'p6', name: '赤じそ', stock: 20 },
                { id: 'p7', name: 'ひまわり', stock: 10 },
                { id: 'p8', name: 'レッドケール', stock: 10 },
                { id: 'p9', name: 'ペッパークレス', stock: 5 },
                { id: 'p10', name: 'マスタード', stock: 3 },
                { id: 'p11', name: 'ロケット', stock: 15 },
                { id: 'p12', name: 'にんじん', stock: 15 },
            ]);

            const [orders, setOrders] = useState([
                { 
                    id: 'o1', date: '10:30', name: '田中 太郎', isRepeater: true, pickupDate: '本日', pickupTime: '15:00-16:00', 
                    itemsList: [{name: 'なないろ菜', qty: 1}, {name: 'デトロイト', qty: 2}], total: 1200, status: '未対応' 
                },
                { 
                    id: 'o2', date: '18:15 (前日)', name: '佐藤 花子', isRepeater: false, pickupDate: '本日', pickupTime: '11:00-12:00', 
                    itemsList: [{name: 'アマランサス', qty: 1}, {name: 'レッドラディッシュ', qty: 1}], total: 800, status: '準備完了' 
                },
                { 
                    id: 'o3', date: '09:00', name: '鈴木 一郎', isRepeater: true, pickupDate: '本日', pickupTime: '16:00-17:00', 
                    itemsList: [{name: '青じそ', qty: 3}], total: 1200, status: '未対応', memo: '可能なら少し多めに欲しいです' 
                },
                // 過去のダミー注文
                { 
                    id: 'o4', date: '04/28 14:00', name: '山田 華子', isRepeater: true, pickupDate: '04/29', pickupTime: '14:00-15:00', 
                    itemsList: [{name: 'レッドラディッシュ', qty: 2}, {name: 'ひまわり', qty: 1}], total: 1200, status: '受渡済' 
                },
                { 
                    id: 'o5', date: '04/15 10:00', name: '佐藤 次郎', isRepeater: false, pickupDate: '04/16', pickupTime: '11:00-12:00', 
                    itemsList: [{name: 'なないろ菜', qty: 5}], total: 2000, status: '受渡済' 
                },
            ]);

            const [selectedProductId, setSelectedProductId] = useState('');
            const [type, setType] = useState('add'); 
            const [amount, setAmount] = useState(1);
            const [memo, setMemo] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [message, setMessage] = useState('');

            const handleActionClick = (productId, actionType) => {
                setSelectedProductId(productId);
                setType(actionType);
                setAmount(1);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };

            const handleSubmitStock = async () => {
                if (!selectedProductId) return alert("商品を選択してください");
                setIsSubmitting(true);
                setTimeout(() => {
                    setProducts(prev => prev.map(p => p.id === selectedProductId ? { ...p, stock: type === 'add' ? p.stock + amount : p.stock - amount } : p));
                    setMessage(`${amount}件の${type === 'add' ? '追加' : '破棄'}を登録しました！`);
                    setTimeout(() => setMessage(''), 3000);
                    setAmount(1); setMemo(''); setIsSubmitting(false);
                }, 800);
            };

            const toggleOrderStatus = (orderId, currentStatus) => {
                const nextStatus = currentStatus === '未対応' ? '準備完了' : currentStatus === '準備完了' ? '受渡済' : '未対応';
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));
            };

            // ==========================================
            // UIコンポーネント: 1. 注文管理タブ
            // ==========================================
            const OrdersTab = () => {
                const [viewMonth, setViewMonth] = useState('2026-05');
                
                const isCurrentMonth = viewMonth === '2026-05';
                const activeOrders = orders.filter(o => o.status !== '受渡済');
                
                const pastOrders = isCurrentMonth 
                    ? orders.filter(o => o.status === '受渡済' && !o.date.startsWith('04'))
                    : orders.filter(o => o.status === '受渡済' && o.date.startsWith('04'));

                return (
                    <div className="animate-slide-up space-y-5">
                        
                        <div className="flex items-center gap-2 mb-4 bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm w-fit">
                            <Icons.Calendar className="w-4 h-4 text-gray-500" />
                            <select 
                                value={viewMonth} 
                                onChange={(e) => setViewMonth(e.target.value)}
                                className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer"
                            >
                                <option value="2026-05">2026年 5月 (今月)</option>
                                <option value="2026-04">2026年 4月</option>
                                <option value="2026-03">2026年 3月</option>
                            </select>
                        </div>

                        {isCurrentMonth && (
                            <>
                                <div className="flex justify-between items-end border-l-4 border-nanairo-dark pl-2">
                                    <h1 className="text-xl font-bold text-gray-800">注文対応</h1>
                                    <span className="text-sm font-bold text-nanairo-dark bg-nanairo-light px-2 py-1 rounded">未対応: {activeOrders.length}件</span>
                                </div>

                                <div className="flex gap-2">
                                    <div className="flex-1 bg-white p-3 rounded-xl border border-gray-200 shadow-sm text-center">
                                        <div className="text-xs text-gray-500 font-bold mb-1">本日の予約</div>
                                        <div className="text-xl font-bold text-gray-800">3 <span className="text-xs font-normal">件</span></div>
                                    </div>
                                    <div className="flex-1 bg-white p-3 rounded-xl border border-gray-200 shadow-sm text-center">
                                        <div className="text-xs text-gray-500 font-bold mb-1">受渡完了</div>
                                        <div className="text-xl font-bold text-gray-800">0 <span className="text-xs font-normal">件</span></div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {activeOrders.map(order => (
                                        <div key={order.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
                                            <div className={`px-4 py-2 flex justify-between items-center text-white font-bold text-sm ${order.status === '未対応' ? 'bg-red-500' : 'bg-nanairo-dark'}`}>
                                                <div className="flex items-center gap-1">
                                                    {order.status === '未対応' ? <Icons.Clock className="w-4 h-4"/> : <Icons.Check className="w-4 h-4"/>}
                                                    {order.status}
                                                </div>
                                                <span className="text-xs font-normal opacity-90">注文: {order.date}</span>
                                            </div>

                                            <div className="p-4">
                                                <div className="flex justify-between items-start mb-3 border-b border-gray-100 pb-3">
                                                    <div>
                                                        <div className="font-bold text-gray-800 text-lg flex items-center gap-2">
                                                            {order.name} 様
                                                            {order.isRepeater ? (
                                                                <span className="bg-yellow-100 text-yellow-700 text-[10px] px-1.5 py-0.5 rounded flex items-center"><Icons.Star className="w-3 h-3 mr-0.5"/> 常連様</span>
                                                            ) : (
                                                                <span className="bg-blue-100 text-blue-700 text-[10px] px-1.5 py-0.5 rounded">🔰 新規</span>
                                                            )}
                                                        </div>
                                                        <div className="text-sm text-nanairo-dark font-bold mt-1 flex items-center gap-1">
                                                            <Icons.ShoppingBag className="w-4 h-4"/> 受取: {order.pickupDate} {order.pickupTime}
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-sm text-gray-500 mb-0.5">合計金額</div>
                                                        <div className="font-bold text-xl text-gray-900">¥{order.total.toLocaleString()}</div>
                                                    </div>
                                                </div>

                                                <div className="mb-4">
                                                    <div className="text-xs text-gray-500 font-bold mb-2">ご注文内容:</div>
                                                    <div className="flex flex-wrap gap-2">
                                                        {order.itemsList.map((item, idx) => (
                                                            <span key={idx} className="bg-green-50 text-green-800 border border-green-200 px-2.5 py-1.5 rounded-lg text-xs font-bold shadow-sm">
                                                                {item.name} <span className="text-green-600 ml-1">×{item.qty}</span>
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>

                                                {order.memo && (
                                                    <div className="bg-yellow-50 border border-yellow-200 p-2.5 rounded-lg mb-4 text-xs text-yellow-800 flex gap-1.5 items-start">
                                                        <Icons.ClipboardList className="w-4 h-4 shrink-0 mt-0.5"/>
                                                        <span>{order.memo}</span>
                                                    </div>
                                                )}

                                                <button 
                                                    onClick={() => toggleOrderStatus(order.id, order.status)}
                                                    className={`w-full py-3 rounded-xl font-bold transition-colors shadow-sm
                                                        ${order.status === '未対応' ? 'bg-nanairo-light text-nanairo-dark border border-nanairo hover:bg-green-100' : 'bg-gray-800 text-white hover:bg-gray-900'}`}
                                                >
                                                    {order.status === '未対応' ? '準備完了にする' : 'お客様に受渡済にする'}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    {activeOrders.length === 0 && (
                                        <div className="text-center py-10 bg-white rounded-xl border border-gray-200 text-gray-500">現在、未対応の注文はありません。</div>
                                    )}
                                </div>
                            </>
                        )}

                        <div className={isCurrentMonth ? "pt-4 border-t border-gray-200" : ""}>
                            <h3 className="font-bold text-gray-600 mb-3 text-sm flex items-center gap-2">
                                <Icons.ClipboardList className="w-4 h-4" /> 
                                {isCurrentMonth ? "最近の受渡済み" : `${viewMonth.replace('-', '年')}月の受渡済み一覧`}
                            </h3>
                            
                            {pastOrders.length === 0 ? (
                                <div className="text-center py-10 bg-gray-50 rounded-xl text-gray-500 text-sm border border-gray-200">
                                    この月の履歴はありません。
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {pastOrders.map(order => (
                                        <div key={order.id} className="bg-white border border-gray-200 p-3 rounded-lg shadow-sm flex justify-between items-center opacity-80">
                                            <div>
                                                <div className="font-bold text-gray-700 text-sm mb-1">{order.name} 様 <span className="text-xs font-normal text-gray-400 ml-2">({order.date})</span></div>
                                                <div className="text-xs text-gray-500">
                                                    {order.itemsList.map(i => `${i.name}×${i.qty}`).join(', ')}
                                                </div>
                                            </div>
                                            <div className="text-right flex flex-col items-end gap-1">
                                                <div className="font-bold text-sm text-gray-800">¥{order.total.toLocaleString()}</div>
                                                {isCurrentMonth && (
                                                    <button onClick={() => toggleOrderStatus(order.id, order.status)} className="text-[10px] font-bold text-gray-500 bg-gray-50 px-2 py-1 rounded border active:bg-gray-200">戻す</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ==========================================
            // UIコンポーネント: 2. 在庫調整タブ
            // ==========================================
            const InventoryTab = () => (
                <div className="animate-slide-up space-y-6">
                    <h1 className="text-xl font-bold text-gray-800 border-l-4 border-nanairo-dark pl-2">在庫管理・調整</h1>

                    {message && (
                        <div className="bg-nanairo-light border border-nanairo text-nanairo-dark px-4 py-3 rounded-xl flex items-center gap-2">
                            <Icons.Check className="w-5 h-5" />
                            <span className="font-bold text-sm">{message}</span>
                        </div>
                    )}

                    <section className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th className="px-3 py-3 font-bold text-gray-600">商品名</th>
                                    <th className="px-2 py-3 font-bold text-gray-600 text-center">在庫</th>
                                    <th className="px-3 py-3 font-bold text-gray-600 text-right">調整</th>
                                </tr>
                            </thead>
                            <tbody>
                                {products.map(p => (
                                    <tr key={p.id} className="border-b border-gray-100 last:border-0">
                                        <td className="px-3 py-3 font-bold text-gray-800 whitespace-nowrap">{p.name}</td>
                                        <td className="px-2 py-3 text-center">
                                            <span className={`font-bold px-2 py-1 rounded-md text-xs ${p.stock <= 5 ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {p.stock}P
                                            </span>
                                        </td>
                                        <td className="px-3 py-3 text-right">
                                            <div className="flex justify-end gap-1">
                                                <button onClick={() => handleActionClick(p.id, 'add')} className="bg-nanairo-dark text-white px-2 py-1.5 rounded text-xs font-bold active:bg-green-700">追加</button>
                                                <button onClick={() => handleActionClick(p.id, 'remove')} className="bg-red-500 text-white px-2 py-1.5 rounded text-xs font-bold active:bg-red-600">破棄</button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </section>

                    <section className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h2 className="font-bold text-gray-800 mb-4 text-base">新しい調整を登録</h2>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">商品を選択</label>
                                <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} className="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 focus:ring-2 focus:ring-nanairo-dark outline-none">
                                    <option value="">選択してください</option>
                                    {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">区分</label>
                                    <div className="flex items-center bg-gray-100 border border-gray-200 rounded-xl h-11 p-1 relative cursor-pointer" onClick={() => setType(type === 'add' ? 'remove' : 'add')}>
                                        <div className={`w-1/2 h-full rounded-lg flex items-center justify-center text-xs font-bold z-10 transition-colors ${type === 'add' ? 'text-white' : 'text-gray-500'}`}>収穫 (追加)</div>
                                        <div className={`w-1/2 h-full rounded-lg flex items-center justify-center text-xs font-bold z-10 transition-colors ${type === 'remove' ? 'text-white' : 'text-gray-500'}`}>ロス (破棄)</div>
                                        <div className={`absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-lg shadow-sm transition-transform duration-300 ${type === 'add' ? 'bg-nanairo-dark left-1 translate-x-0' : 'bg-red-500 left-1 translate-x-full'}`}></div>
                                    </div>
                                </div>
                                <div className="w-24">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">数量</label>
                                    <div className="flex items-center border border-gray-300 rounded-xl bg-gray-50 h-11 overflow-hidden">
