<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【管理者用】なないろ菜 ダッシュボード</title>
    
    <link rel="apple-touch-icon" href="https://i.imgur.com/tqZC8OZ.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/tqZC8OZ.png">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nanairo': { light: '#e6f4ea', DEFAULT: '#4ade80', dark: '#16a34a' },
                        'nanairo-accent': '#f97316',
                        'line': '#06C755'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body {
            background-color: #f3f4f6; font-family: -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 600px; margin: 0 auto; background-color: #f3f4f6;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
        }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .spinner-dark { border-color: rgba(0,0,0,0.1); border-left-color: #16a34a; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* 印刷・PDF用の徹底的なスタイル調整 */
        @media print {
            @page { margin: 0; size: auto; } 
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: white; } 
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area {
                position: absolute; left: 0; top: 0; width: 100%;
                background-color: white; margin: 0; padding: 0;
            }
            .no-print { display: none !important; }
            .page-break { page-break-after: always; margin-bottom: 0 !important; border: none !important; }
            .app-container { max-width: 100%; background-color: white; box-shadow: none; }
            
            /* キッチンプリンター用スタイル */
            .receipt-print {
                width: 100%;
                max-width: 80mm;
                margin: 0 auto;
                font-family: 'Helvetica Neue', monospace, sans-serif;
                color: #000;
            }
            .receipt-print * {
                visibility: visible;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Plus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Check: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            Box: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            ClipboardList: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            TrendingUp: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Clock: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            AlertTriangle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            ShoppingBag: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            Calendar: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            RefreshCw: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Printer: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            FileText: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            X: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Award: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            XCircle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Info: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
            Server: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>,
            History: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        };

        // ★あなたの環境のGAS URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        const toWareki = (dateStr) => {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `R${d.getFullYear() - 2018}.${d.getMonth() + 1}.${d.getDate()}`;
        };

        function App() {
            const [activeTab, setActiveTab] = useState('orders'); 
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [analytics, setAnalytics] = useState(null);
            const [stockLogs, setStockLogs] = useState([]); 
            
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isFetchingData, setIsFetchingData] = useState(false);

            const [selectedProductId, setSelectedProductId] = useState('');
            const [type, setType] = useState('add'); 
            const [amount, setAmount] = useState(1);
            const [stockMemo, setStockMemo] = useState(''); 
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            // ★トーストメッセージ用のステート
            const [message, setMessage] = useState('');
            const showMessage = (text, duration = 4000) => {
                setMessage(text);
                setTimeout(() => setMessage(''), duration);
            };
            
            const [showBulkLossModal, setShowBulkLossModal] = useState(false);
            const [isBulkSubmitting, setIsBulkSubmitting] = useState(false);

            const [cancelTargetLog, setCancelTargetLog] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);

            const todayMonth = new Date().toISOString().slice(0, 7);
            const [viewStartMonth, setViewStartMonth] = useState(todayMonth);
            const [viewEndMonth, setViewEndMonth] = useState(todayMonth);

            const [isPastOrdersOpen, setIsPastOrdersOpen] = useState(false);
            const [showAllProductsModal, setShowAllProductsModal] = useState(false);
            const [showAllCustomersModal, setShowAllCustomersModal] = useState(false);
            const [searchCustomer, setSearchCustomer] = useState("");

            const [printOrders, setPrintOrders] = useState([]); 
            const [printType, setPrintType] = useState('invoice'); 
            const [printName, setPrintName] = useState(''); 
            const [printHonorific, setPrintHonorific] = useState('御中');
            const [showCustomerModal, setShowCustomerModal] = useState(null); 
            
            const [reportStartDate, setReportStartDate] = useState('');
            const [reportEndDate, setReportEndDate] = useState('');
            const [reportClosingDate, setReportClosingDate] = useState('');

            const [isAutoPrintEnabled, setIsAutoPrintEnabled] = useState(false);
            const [printLogs, setPrintLogs] = useState(() => {
                try { return JSON.parse(localStorage.getItem('nanairo_print_log')) || []; }
                catch { return []; }
            });
            const [autoPrintQueue, setAutoPrintQueue] = useState([]);

            const fetchData = async (startMonth, endMonth) => {
                setIsFetchingData(true);
                try {
                    const response = await fetch(`${GAS_URL}?action=getAdminData&month=${startMonth}&endMonth=${endMonth}`);
                    const data = await response.json();
                    
                    if (data.status === 'error') {
                        console.error("サーバーエラー:", data.message);
                        showMessage("データの取得に失敗しました。");
                        return;
                    }
                    if (data.products) setProducts(data.products.filter(p => p.name !== "なないろ菜"));
                    if (data.orders) setOrders(data.orders);
                    if (data.analytics) setAnalytics(data.analytics);
                    if (data.stockLogs) setStockLogs(data.stockLogs);
                } catch (error) {
                    console.error("通信エラー:", error);
                } finally {
                    setIsLoadingData(false);
                    setIsFetchingData(false);
                }
            };

            useEffect(() => {
                if (viewStartMonth > viewEndMonth) setViewEndMonth(viewStartMonth);
                fetchData(viewStartMonth, viewEndMonth);
            }, [viewStartMonth, viewEndMonth]);

            const handleRefresh = () => fetchData(viewStartMonth, viewEndMonth);

            // 自動更新(15分間隔)
            useEffect(() => {
                let intervalId;
                if (isAutoPrintEnabled) {
                    intervalId = setInterval(() => {
                        fetchData(viewStartMonth, viewEndMonth);
                    }, 900000); 
                }
                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, [isAutoPrintEnabled, viewStartMonth, viewEndMonth]);

            // 自動印刷実行ロジック
            useEffect(() => {
                if (!isAutoPrintEnabled) return;
                if (isLoadingData || isFetchingData) return;

                const unprinted = orders.filter(o => o.status === '未対応' && !printLogs.some(log => log.id === o.id));
                
                if (unprinted.length > 0 && autoPrintQueue.length === 0 && printOrders.length === 0) {
                    try {
                        const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
                        audio.play().catch(e => console.log('Audio play blocked:', e));
                    } catch(e) {}

                    showMessage(`${unprinted.length}件の新規注文が入りました！`, 6000);

                    setAutoPrintQueue(unprinted);
                    setPrintOrders(unprinted);
                    setPrintType('kitchen_receipt'); 
                    
                    setTimeout(() => {
                        window.print();
                        
                        const now = new Date();
                        const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                        const newLogs = unprinted.map(o => ({
                            id: o.id,
                            userName: o.userName,
                            printedAt: timeStr
                        }));
                        const updatedLogs = [...newLogs, ...printLogs].slice(0, 100);
                        setPrintLogs(updatedLogs);
                        localStorage.setItem('nanairo_print_log', JSON.stringify(updatedLogs));
                        
                        setAutoPrintQueue([]);
                        setPrintOrders([]);
                        setPrintType('invoice'); 
                    }, 800);
                }
            }, [orders, isAutoPrintEnabled, printLogs, autoPrintQueue, printOrders, isLoadingData, isFetchingData]);


            const handleActionClick = (productId, actionType) => {
                setSelectedProductId(productId);
                setType(actionType);
                setAmount(1);
                setStockMemo(''); 
                
                setTimeout(() => {
                    const formEl = document.getElementById('manual-input-form');
                    if (formEl) {
                        const y = formEl.getBoundingClientRect().top + window.scrollY - 70;
                        window.scrollTo({ top: y, behavior: 'smooth' });
                    }
                }, 50);
            };

            const handleSubmitStock = async () => {
                if (!selectedProductId) return showMessage("商品を選択してください");
                setIsSubmitting(true);
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "stockUpdate",
                            productId: selectedProductId,
                            type: type, 
                            amount: amount,
                            memo: stockMemo 
                        })
                    });
                    
                    const actionName = type === 'add' ? '収穫(追加)' : type === 'sale' ? '店頭販売' : 'ロス(破棄)';
                    showMessage(`${amount}件の「${actionName}」を記録しました！`);
                    
                    fetchData(viewStartMonth, viewEndMonth);
                    setAmount(1); setStockMemo(''); 
                } catch(error) {
                    showMessage("エラーが発生しました。");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleBulkLoss = async () => {
                setIsBulkSubmitting(true);
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "bulkLoss" })
                    });
                    
                    showMessage(`現在在庫がある全商品を一括でロス(破棄)にしました！`);
                    fetchData(viewStartMonth, viewEndMonth);
                } catch(error) {
                    showMessage("エラーが発生しました。");
                } finally {
                    setIsBulkSubmitting(false);
                    setShowBulkLossModal(false);
                }
            };

            const handleCancelStockLog = async () => {
                if (!cancelTargetLog || isCancelling) return;
                setIsCancelling(true);
                try {
                    const res = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "cancelStockLog",
                            rowIndex: cancelTargetLog.rowIndex
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'error') {
                        showMessage("取消エラー: " + data.message);
                    } else {
                        showMessage(`記録を取り消し、在庫を元に戻しました。`);
                        fetchData(viewStartMonth, viewEndMonth);
                    }
                } catch(error) {
                    showMessage("通信エラーが発生しました。");
                } finally {
                    setIsCancelling(false);
                    setCancelTargetLog(null);
                }
            };

            const toggleOrderStatus = async (orderId, currentStatus) => {
                if(currentStatus === 'キャンセル') return; 
                
                const nextStatus = currentStatus === '未対応' ? '準備完了' : currentStatus === '準備完了' ? '受渡済' : '未対応';
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "statusUpdate", orderId: orderId, newStatus: nextStatus })
                    });
                    fetchData(viewStartMonth, viewEndMonth);
                } catch(error) {
                    showMessage("ステータス更新に失敗しました。");
                    setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: currentStatus } : o));
                }
            };

            const toggleCheck = async (orderId, role, isChecked) => {
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, [role === 'senmu' ? 'senmuChecked' : 'cafeChecked']: isChecked } : o));
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "toggleCheck", orderId: orderId, role: role, isChecked: isChecked })
                    });
                } catch(error) {
                    showMessage("確認状態の更新に失敗しました。");
                    fetchData(viewStartMonth, viewEndMonth);
                }
            };

            // ★全ての印刷プレビューを開く関数を堅牢化
            const openPrintPreview = (order, type) => {
                setPrintOrders([order]);
                setPrintType(type);
                setPrintName(order.userName || '');
            };

            const openMonthlyReportPreview = (customer) => {
                if (!customer) return;
                setPrintOrders([customer]); 
                setPrintType('monthly_report');
                setPrintName(customer.userName || '');
                setPrintHonorific('御中');
                
                const start = `${viewStartMonth}-01`;
                const [y, m] = viewEndMonth.split('-').map(Number);
                const endLastDay = new Date(y, m, 0).getDate();
                const end = `${viewEndMonth}-${String(endLastDay).padStart(2, '0')}`;
                
                setReportStartDate(start);
                setReportEndDate(end);
                setReportClosingDate(end);
                
                setShowCustomerModal(null); 
            };

            const openBulkPrintPreview = (type) => {
                const printableOrders = orders.filter(o => o.status !== 'キャンセル');
                if(printableOrders.length === 0) {
                    showMessage("指定期間に印刷可能な注文がありません。");
                    return;
                }
                setPrintOrders(printableOrders);
                setPrintType(type);
            };

            const executePrint = () => {
                window.print();
            };

            // ローディング画面
            if (isLoadingData) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-50 text-gray-500">
                        <div className="spinner spinner-dark mb-4"></div>
                        <p className="font-bold">最新データを同期中...</p>
                    </div>
                );
            }

            // ==========================================
            // UI: 各種印刷・PDFプレビューモーダル (最も前面 Z-100)
            // ==========================================
            const renderPrintView = () => {
                if(printOrders.length === 0) return null;
                const todayText = toWareki(new Date().toISOString().split('T')[0]);

                // 1. 自動印刷（キッチンプリンター用）
                if (printType === 'kitchen_receipt') {
                    return (
                        <div className="fixed inset-0 z-[100] bg-gray-100 flex flex-col print-area h-screen overflow-y-auto">
                            <div className="no-print bg-blue-100 p-4 font-bold text-blue-800 flex justify-between items-center shadow-sm z-10 sticky top-0">
                                <span className="flex items-center gap-2"><Icons.Printer className="w-5 h-5"/>自動印刷プレビュー (レシート形式)</span>
                                <button onClick={() => { setPrintOrders([]); setAutoPrintQueue([]); setPrintType('invoice'); }} className="bg-white px-3 py-1.5 rounded-lg shadow-sm text-sm active:bg-gray-50 text-gray-700">
                                    閉じる
                                </button>
                            </div>
                            <div className="p-4 mt-2 overflow-x-auto flex-1 bg-white sm:bg-gray-100">
                                {printOrders.map(order => (
                                    <div key={order.id} className="receipt-page-break bg-white p-4 mb-4 receipt-print mx-auto text-black border sm:shadow-sm" style={{width: '100%', maxWidth: '80mm', boxSizing: 'border-box'}}>
                                        <div className="text-center font-bold text-xl mb-4 border-b-2 border-black pb-2 tracking-widest">新規注文</div>
                                        <div className="text-sm mb-3">
                                            <div className="mb-1">注文日: <span className="font-mono">{order.orderDate}</span></div>
                                            <div className="text-lg font-bold my-2">{order.userName} 様</div>
                                            <div className="bg-gray-200 p-2 rounded text-center border border-black font-bold">
                                                受取予定<br/>

                                    <p className="text-[11px] text-gray-500 mt-1.5 leading-relaxed font-bold">
                                        オンにすると新着注文を監視し、アラート音でお知らせして印刷画面を開きます。<br/>
                                        <span className="text-nanairo-dark">※通信量節約のため15分に1回確認します。</span>
                                    </p>
                                </div>
                                
                                <div 
                                    onClick={() => setIsAutoPrintEnabled(!isAutoPrintEnabled)}
                                    role="button"
                                    className={`w-14 h-8 flex items-center rounded-full p-1 cursor-pointer transition-colors ${isAutoPrintEnabled ? 'bg-blue-500' : 'bg-gray-300'}`}
                                >
                                    <div className={`bg-white w-6 h-6 rounded-full shadow-md transform transition-transform ${isAutoPrintEnabled ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                </div>
                            </div>

                            <div className="bg-white p-3 rounded-xl text-sm border border-gray-100 flex flex-col gap-2">
                                <div className="flex justify-between">
                                    <span className="text-gray-500 font-bold">状態:</span>
                                    <span className={`font-bold flex items-center gap-1 ${isAutoPrintEnabled ? 'text-blue-600' : 'text-gray-500'}`}>
                                        {isAutoPrintEnabled && <div className="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>}
                                        {isAutoPrintEnabled ? '監視中 (15分間隔)' : '停止中'}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center border-t border-gray-100 pt-2 mt-1">
                                    <span className="text-gray-500 font-bold">印刷済み件数:</span>
                                    <span className="font-bold text-gray-800">{printLogs.length} 件</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="font-bold text-gray-700 text-sm flex items-center gap-2">
                                    <Icons.History className="w-4 h-4 text-gray-400"/> 印刷実行ログ (この端末)
                                </h3>
                                <button type="button" onClick={() => {
                                    if(confirm("印刷ログをリセットしますか？\n（リセットすると現在未対応の注文がすべて再度印刷されます）")) {
                                        setPrintLogs([]);
                                        localStorage.removeItem('nanairo_print_log');
                                    }
                                }} className="text-[10px] text-gray-400 underline hover:text-gray-600">ログをリセット</button>
                            </div>
                            <div className="space-y-2 max-h-48 overflow-y-auto">
                                {printLogs.length === 0 ? (
                                    <p className="text-xs text-gray-500 text-center py-2">ログはありません</p>
                                ) : (
                                    printLogs.map((log, idx) => (
                                        <div key={idx} className="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-100">
                                            <span className="text-xs font-bold text-gray-700">{log.userName} 様</span>
                                            <span className="text-[10px] text-gray-500">{log.printedAt} 印刷</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><Icons.Info className="w-4 h-4 text-gray-400"/> 使い方と準備</h3>
                            <ul className="text-xs text-gray-600 space-y-3 list-disc pl-4 leading-relaxed">
                                <li>
                                    このPCとキッチンプリンター（TM-T90KP）を接続し、PCの「既定のプリンター」として設定してください。<br/>
                                    用紙サイズは「80×297mm」などのロール紙設定にしておきます。
                                </li>
                                <li>監視をオンにしたまま、この画面を閉じずに開きっぱなしにしてください。</li>
                                <li>新規の注文が入ると自動的に印刷プレビューが立ち上がり、印刷を実行します（iPad等の場合は「プリント」を手動でタップしてください）。</li>
                            </ul>
                        </div>
                        
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2">テスト印刷</h3>
                            <button type="button" onClick={() => {
                                setPrintType('kitchen_receipt');
                                setPrintOrders([{
                                    id: 'test-123',
                                    orderDate: new Date().toLocaleString(),
                                    userName: 'テスト 太郎',
                                    pickupDate: toWareki(new Date()),
                                    pickupTime: '12:00-13:00',
                                    itemsList: [{name: 'テスト商品（見本）', qty: 2}, {name: 'なないろ菜ミックス（見本）', qty: 1}],
                                    totalPrice: 1500,
                                    memo: 'これはプリンター動作確認のためのテスト印刷です。'
                                }]);
                                setTimeout(() => {
                                    window.print();
                                    setPrintOrders([]);
                                    setPrintType('invoice');
                                }, 500);
                            }} className="w-full bg-gray-800 text-white text-sm font-bold px-4 py-3 rounded-lg active:bg-gray-900 flex justify-center items-center gap-2">
                                <Icons.Printer className="w-4 h-4"/> テストレシートを出力
                            </button>
                        </div>
                    </div>
                );
            };

            const renderCustomerModal = () => {
                if (!showCustomerModal) return null;
                const c = showCustomerModal;
                return (
                    <div className="fixed inset-0 z-[100] bg-black/50 flex flex-col justify-end items-center no-print">
                        <div className="bg-white rounded-t-2xl w-full max-w-[600px] max-h-[80vh] flex flex-col animate-slide-up shadow-2xl">
                            <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                <h2 className="font-bold text-base flex items-center gap-2"><Icons.User className="w-5 h-5" />購入カルテ</h2>
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => openMonthlyReportPreview(c)} className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm active:bg-blue-700 flex items-center gap-1">
                                        <Icons.FileText className="w-3.5 h-3.5"/> 請求明細書を作成
                                    </button>
                                    <button type="button" onClick={() => setShowCustomerModal(null)} className="p-1.5 bg-gray-100 rounded-full active:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                                </div>
                            </div>
                            <div className="overflow-y-auto p-5 pb-10">
                                <h3 className="text-xl font-bold text-gray-900 border-b-2 border-gray-800 inline-block pb-1 pr-4 mb-6">{c.userName} 様</h3>
                                
                                <div className="grid grid-cols-2 gap-3 mb-6">
                                    <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                        <div className="text-xs font-bold text-blue-700 mb-1">期間内 累計購入額</div>
                                        <div className="text-xl font-bold text-blue-900">¥{(c.totalSpend || 0).toLocaleString()}</div>
                                    </div>
                                    <div className="bg-green-50 p-3 rounded-lg border border-green-100">
                                        <div className="text-xs font-bold text-green-700 mb-1">期間内 注文回数</div>
                                        <div className="text-xl font-bold text-green-900">{c.orderCount || 0} <span className="text-sm">回</span></div>
                                    </div>
                                </div>

                                <h4 className="font-bold text-gray-700 text-sm mb-3 border-b border-gray-200 pb-2">商品別の購入内訳</h4>
                                <ul className="space-y-2">
                                    {c.items && Object.entries(c.items).sort((a,b)=>b[1]-a[1]).map(([itemName, qty]) => (
                                        <li key={itemName} className="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border border-gray-100">
                                            <span className="font-bold text-sm text-gray-800">{itemName}</span>
                                            <span className="font-bold text-gray-600 bg-white px-2 py-1 rounded shadow-sm text-xs">累計 {qty} P</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </div>
                )
            }

            const renderAllProductsModal = () => {
                if (!showAllProductsModal) return null;
                const topProducts = analytics?.topProducts || [];
                const maxQty = topProducts.length > 0 ? topProducts[0].qty : 1;
                return (
                    <div className="fixed inset-0 z-[100] bg-black/50 flex flex-col justify-end items-center no-print">
                        <div className="bg-white rounded-t-2xl w-full max-w-[600px] max-h-[80vh] flex flex-col animate-slide-up shadow-2xl">
                            <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                <h2 className="font-bold text-base flex items-center gap-2"><Icons.ShoppingBag className="w-5 h-5 text-blue-500" />商品ランキング全件</h2>
                                <button type="button" onClick={() => setShowAllProductsModal(false)} className="p-1.5 bg-gray-100 rounded-full active:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                            </div>
                            <div className="overflow-y-auto p-5 pb-10 space-y-4">
                                {topProducts.map((p, idx) => {
                                    const percent = Math.max(5, Math.round((p.qty / maxQty) * 100));
                                    return (
                                        <div key={p.name}>
                                            <div className="flex justify-between items-center mb-1">
                                                <div className="text-sm font-bold text-gray-800 flex items-center gap-2"><span className="text-gray-400">{idx + 1}.</span> {p.name}</div>
                                                <div className="text-sm font-bold text-gray-600">{p.qty} P</div>
                                            </div>
                                            <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                                                <div className="bg-blue-400 h-full" style={{ width: `${percent}%` }}></div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                )
            }

            const renderAllCustomersModal = () => {
                if (!showAllCustomersModal) return null;
                const allCustomers = analytics?.topCustomers || [];
                const filtered = allCustomers.filter(c => c.userName.toLowerCase().includes(searchCustomer.toLowerCase()));
                return (
                    <div className="fixed inset-0 z-[100] bg-black/50 flex flex-col justify-end items-center no-print">
                        <div className="bg-white rounded-t-2xl w-full max-w-[600px] max-h-[90vh] flex flex-col animate-slide-up shadow-2xl">
                            <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                <h2 className="font-bold text-base flex items-center gap-2"><Icons.Award className="w-5 h-5 text-yellow-500" />顧客ランキング全件</h2>
                                <button type="button" onClick={() => {setShowAllCustomersModal(false); setSearchCustomer("");}} className="p-1.5 bg-gray-100 rounded-full active:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                            </div>
                            <div className="p-4 border-b bg-gray-50 shrink-0">
                                <input type="text" placeholder="お客様の名前で検索..." value={searchCustomer} onChange={(e) => setSearchCustomer(e.target.value)}
                                    className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-nanairo-dark" />
                            </div>
                            <div className="overflow-y-auto p-4 pb-10 space-y-2">
                                {filtered.length === 0 ? (
                                    <p className="text-center text-sm text-gray-500 py-4">該当するお客様が見つかりません</p>
                                ) : (
                                    filtered.map((customer, idx) => {
                                        const rank = allCustomers.findIndex(c => c.userId === customer.userId) + 1;
                                        return (
                                            <div key={customer.userId} 
                                                role="button"
                                                tabIndex={0}
                                                onClick={() => {setShowAllCustomersModal(false); setShowCustomerModal(customer);}} 
                                                className="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 cursor-pointer active:bg-gray-50 shadow-sm transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-600">{rank}</div>
                                                    <div>
                                                        <div className="font-bold text-sm text-gray-800">{customer.userName} 様</div>
                                                        <div className="text-[10px] text-gray-500">注文回数: {customer.orderCount}回</div>
                                                    </div>
                                                </div>
                                                <div className="font-bold text-nanairo-dark">¥{(customer.totalSpend || 0).toLocaleString()}</div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                )
            }

            return (
                <div className="app-container">
                    <header className="no-print sticky top-0 z-30 bg-nanairo-light px-4 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-7 h-7 bg-line rounded-full flex items-center justify-center text-white font-bold text-[9px] tracking-tighter">LINE</div>
                            <span className="font-bold text-gray-800 text-sm">マイクロハーブ <span className="text-nanairo-dark text-xs ml-1">[管理]</span></span>
                        </div>
                    </header>

                    {/* ★通知トーストを前面に・クリックをブロックしない */}
                    {message && (
                        <div className="no-print pointer-events-none fixed top-16 left-0 right-0 mx-auto w-11/12 max-w-[500px] z-[90] bg-nanairo-light border border-nanairo text-nanairo-dark px-4 py-3 rounded-xl flex items-center gap-2 animate-slide-up shadow-lg">
                            <Icons.Check className="w-5 h-5 shrink-0" />
                            <span className="font-bold text-sm">{message}</span>
                        </div>
                    )}

                    <main className="no-print flex-1 px-4 pt-4 pb-[120px] relative z-0">
                        {activeTab === 'orders' && renderOrdersTab()}
                        {activeTab === 'inventory' && renderInventoryTab()}
                        {activeTab === 'analytics' && renderAnalyticsTab()}
                        {activeTab === 'hub' && renderHubTab()}
                    </main>

                    {/* ★各種モーダル・プレビューを Main とは独立して配置 */}
                    {renderPrintView()}
                    {renderCustomerModal()}
                    {renderAllProductsModal()}
                    {renderAllCustomersModal()}

                    {/* ボトムナビゲーション */}
                    <div className="no-print fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[600px] bg-white border-t border-gray-200 flex h-[60px] z-40 pb-[env(safe-area-inset-bottom)] box-border">
                        <button type="button" onClick={() => setActiveTab('orders')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'orders' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.ClipboardList className="w-6 h-6" />
                                {orders.filter(o=>o.status==='未対応').length > 0 && (
                                    <div className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>
                                )}
                            </div>
                            <span className="text-[10px] font-bold">注文対応</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('inventory')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'inventory' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.Box className="w-6 h-6" />
                            <span className="text-[10px] font-bold">在庫・販売</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('analytics')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'analytics' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.TrendingUp className="w-6 h-6" />
                            <span className="text-[10px] font-bold">分析</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('hub')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'hub' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.Server className="w-6 h-6" />
                                {isAutoPrintEnabled && <div className="absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full animate-pulse border-2 border-white"></div>}
                            </div>
                            <span className="text-[10px] font-bold">印刷ハブ</span>
                        </button>
                    </div>

                    {showBulkLossModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3">
                                        <Icons.AlertTriangle className="w-7 h-7" />
                                    </div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">在庫を一括ロスしますか？</h3>
                                    <p className="text-xs text-gray-500">
                                        現在在庫が残っているすべての商品の在庫を「0」にし、一括でロス（破棄）として記録します。<br/>
                                        <span className="text-red-500 mt-1 inline-block">この操作は一度に多数のデータを更新します。</span>
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setShowBulkLossModal(false)} disabled={isBulkSubmitting} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">
                                        キャンセル
                                    </button>
                                    <button type="button" onClick={handleBulkLoss} disabled={isBulkSubmitting} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">
                                        {isBulkSubmitting ? <div className="spinner border-l-white w-4 h-4"></div> : '一括ロス実行'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {cancelTargetLog && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3">
                                        <Icons.AlertTriangle className="w-7 h-7" />
                                    </div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">この記録を取り消しますか？</h3>
                                    <p className="text-xs text-gray-500">
                                        在庫数は自動的に元に戻ります。<br/>
                                        店頭販売の場合は売上からも除外されます。
                                    </p>
                                </div>
                                
                                <div className="bg-gray-50 rounded-lg p-3 text-sm text-gray-700 font-bold border border-gray-200 mb-5 text-center">
                                    {cancelTargetLog.type}：{cancelTargetLog.name} {cancelTargetLog.amount}P
                                </div>
                                
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setCancelTargetLog(null)} disabled={isCancelling} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">
                                        閉じる
                                    </button>
                                    <button type="button" onClick={handleCancelStockLog} disabled={isCancelling} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">
                                        {isCancelling ? <div className="spinner border-l-white w-4 h-4"></div> : '取り消す'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
