<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【管理者用】なないろ菜 統合ダッシュボード</title>
    
    <link rel="apple-touch-icon" href="https://i.imgur.com/tqZC8OZ.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/tqZC8OZ.png">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nanairo': { light: '#e6f4ea', DEFAULT: '#4ade80', dark: '#16a34a' },
                        'nanairo-accent': '#f97316',
                        'line': '#06C755',
                        'agency': { light: '#fff7ed', DEFAULT: '#f97316', dark: '#c2410c' } // 委託販売用テーマ（オレンジ系）
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body {
            background-color: #f3f4f6; font-family: -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 600px; margin: 0 auto; background-color: #f3f4f6;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
        }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .spinner-dark { border-color: rgba(0,0,0,0.1); border-left-color: #16a34a; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* 印刷用スタイル */
        @media print {
            @page { margin: 0; size: auto; } 
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: white; } 
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area {
                position: absolute; left: 0; top: 0; width: 100%;
                background-color: white; margin: 0; padding: 0;
            }
            .no-print { display: none !important; }
            .page-break { page-break-after: always; margin-bottom: 0 !important; border: none !important; }
            .app-container { max-width: 100%; background-color: white; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icons = {
            Plus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Check: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            Box: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            ClipboardList: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            TrendingUp: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Clock: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            AlertTriangle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            ShoppingBag: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            Calendar: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            RefreshCw: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Printer: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            FileText: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            X: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Award: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            XCircle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Truck: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Store: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        const toWareki = (dateStr) => {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `R${d.getFullYear() - 2018}.${d.getMonth() + 1}.${d.getDate()}`;
        };

        function App() {
            // アクティブタブ: orders, inventory, agency, analytics
            const [activeTab, setActiveTab] = useState('orders'); 
            
            // 直販・共通データ
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [analytics, setAnalytics] = useState(null);
            const [stockLogs, setStockLogs] = useState([]); 
            
            // 委託販売(Agency)データ
            const [agencies, setAgencies] = useState([]);
            const [agencyPrices, setAgencyPrices] = useState([]);
            const [agencyDeliveries, setAgencyDeliveries] = useState([]);
            
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isFetchingData, setIsFetchingData] = useState(false);

            // 通知メッセージ
            const [message, setMessage] = useState('');
            const showMessage = (text, duration = 4000) => {
                setMessage(text);
                setTimeout(() => setMessage(''), duration);
            };

            // 手動在庫調整用
            const [selectedProductId, setSelectedProductId] = useState('');
            const [type, setType] = useState('add'); 
            const [amount, setAmount] = useState(1);
            const [stockMemo, setStockMemo] = useState(''); 
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [showBulkLossModal, setShowBulkLossModal] = useState(false);
            const [isBulkSubmitting, setIsBulkSubmitting] = useState(false);
            const [cancelTargetLog, setCancelTargetLog] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);

            // 期間フィルター
            const todayMonth = new Date().toISOString().slice(0, 7);
            const [viewStartMonth, setViewStartMonth] = useState(todayMonth);
            const [viewEndMonth, setViewEndMonth] = useState(todayMonth);

            // モーダル・印刷用
            const [isPastOrdersOpen, setIsPastOrdersOpen] = useState(false);
            const [showAllProductsModal, setShowAllProductsModal] = useState(false);
            const [showAllCustomersModal, setShowAllCustomersModal] = useState(false);
            const [searchCustomer, setSearchCustomer] = useState("");
            const [printOrders, setPrintOrders] = useState([]); 
            const [printType, setPrintType] = useState('invoice'); 
            const [printName, setPrintName] = useState(''); 
            const [printHonorific, setPrintHonorific] = useState('御中');
            const [showCustomerModal, setShowCustomerModal] = useState(null); 
            const [reportStartDate, setReportStartDate] = useState('');
            const [reportEndDate, setReportEndDate] = useState('');
            const [reportClosingDate, setReportClosingDate] = useState('');

            // 委託販売用のState
            const [selectedAgencyId, setSelectedAgencyId] = useState('');
            const [deliveryCart, setDeliveryCart] = useState({});
            const [isSubmittingDelivery, setIsSubmittingDelivery] = useState(false);
            const [inventoryModal, setInventoryModal] = useState(null); 
            const [invSalesQty, setInvSalesQty] = useState(0);
            const [invLossQty, setInvLossQty] = useState(0);

            const fetchData = async (startMonth, endMonth) => {
                setIsFetchingData(true);
                try {
                    const response = await fetch(`${GAS_URL}?action=getAdminData&month=${startMonth}&endMonth=${endMonth}`);
                    const data = await response.json();
                    
                    if (data.status === 'error') {
                        showMessage("データの取得に失敗しました。");
                        return;
                    }
                    if (data.products) setProducts(data.products.filter(p => p.name !== "なないろ菜"));
                    if (data.orders) setOrders(data.orders);
                    if (data.analytics) setAnalytics(data.analytics);
                    if (data.stockLogs) setStockLogs(data.stockLogs);
                    
                    // 委託データ
                    if (data.agencies) setAgencies(data.agencies);
                    if (data.agencyPrices) setAgencyPrices(data.agencyPrices);
                    if (data.agencyDeliveries) setAgencyDeliveries(data.agencyDeliveries);
                } catch (error) {
                    console.error("通信エラー:", error);
                } finally {
                    setIsLoadingData(false);
                    setIsFetchingData(false);
                }
            };

            useEffect(() => {
                if (viewStartMonth > viewEndMonth) setViewEndMonth(viewStartMonth);
                fetchData(viewStartMonth, viewEndMonth);
            }, [viewStartMonth, viewEndMonth]);

            const handleRefresh = () => fetchData(viewStartMonth, viewEndMonth);

            // 在庫追加・ロス・店頭販売
            const handleActionClick = (productId, actionType) => {
                setSelectedProductId(productId);
                setType(actionType);
                setAmount(1);
                setStockMemo(''); 
                setTimeout(() => {
                    const formEl = document.getElementById('manual-input-form');
                    if (formEl) window.scrollTo({ top: formEl.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
                }, 50);
            };

            const handleSubmitStock = async () => {
                if (!selectedProductId) return showMessage("商品を選択してください");
                setIsSubmitting(true);
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "stockUpdate", productId: selectedProductId, type: type, amount: amount, memo: stockMemo })
                    });
                    const actionName = type === 'add' ? '収穫(追加)' : type === 'sale' ? '店頭販売' : 'ロス(破棄)';
                    showMessage(`${amount}件の「${actionName}」を記録しました！`);
                    fetchData(viewStartMonth, viewEndMonth);
                    setAmount(1); setStockMemo(''); 
                } catch(error) { showMessage("エラーが発生しました。"); } 
                finally { setIsSubmitting(false); }
            };

            const handleBulkLoss = async () => {
                setIsBulkSubmitting(true);
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "bulkLoss" })
                    });
                    showMessage(`現在在庫がある全商品を一括でロス(破棄)にしました！`);
                    fetchData(viewStartMonth, viewEndMonth);
                } catch(error) { showMessage("エラーが発生しました。"); } 
                finally { setIsBulkSubmitting(false); setShowBulkLossModal(false); }
            };

            const handleCancelStockLog = async () => {
                if (!cancelTargetLog || isCancelling) return;
                setIsCancelling(true);
                try {
                    const res = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "cancelStockLog", rowIndex: cancelTargetLog.rowIndex })
                    });
                    const data = await res.json();
                    if (data.status === 'error') showMessage("取消エラー: " + data.message);
                    else { showMessage(`記録を取り消し、在庫を元に戻しました。`); fetchData(viewStartMonth, viewEndMonth); }
                } catch(error) { showMessage("通信エラーが発生しました。"); } 
                finally { setIsCancelling(false); setCancelTargetLog(null); }
            };

            const toggleOrderStatus = async (orderId, currentStatus) => {
                if(currentStatus === 'キャンセル') return; 
                const nextStatus = currentStatus === '未対応' ? '準備完了' : currentStatus === '準備完了' ? '受渡済' : '未対応';
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "statusUpdate", orderId: orderId, newStatus: nextStatus })
                    });
                    fetchData(viewStartMonth, viewEndMonth);
                } catch(error) {
                    showMessage("ステータス更新に失敗しました。");
                    setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: currentStatus } : o));
                }
            };

            const toggleCheck = async (orderId, role, isChecked) => {
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, [role === 'senmu' ? 'senmuChecked' : 'cafeChecked']: isChecked } : o));
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "toggleCheck", orderId: orderId, role: role, isChecked: isChecked })
                    });
                } catch(error) { showMessage("確認状態の更新に失敗しました。"); fetchData(viewStartMonth, viewEndMonth); }
            };

            const updateDeliveryCart = (productId, delta) => {
                setDeliveryCart(prev => {
                    const current = prev[productId] || 0;
                    const next = Math.max(0, current + delta);
                    const newCart = { ...prev };
                    if (next === 0) delete newCart[productId];
                    else newCart[productId] = next;
                    return newCart;
                });
            };

            const handleAgencyDelivery = async () => {
                if (!selectedAgencyId) return showMessage("委託先を選択してください");
                const itemIds = Object.keys(deliveryCart);
                if (itemIds.length === 0) return showMessage("納品する商品を選択してください");

                setIsSubmittingDelivery(true);
                const agency = agencies.find(a => a.id === selectedAgencyId);
                const itemsToDeliver = itemIds.map(pid => {
                    const p = products.find(prod => prod.id === pid);
                    return { productId: pid, productName: p.name, qty: deliveryCart[pid] };
                });

                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "agencyDelivery", agencyId: agency.id, agencyName: agency.name, items: itemsToDeliver })
                    });
                    
                    showMessage(`${agency.name} への納品を記録しました！`);
                    
                    // 納品書プレビュー表示用データ作成
                    const invoiceData = {
                        id: `preview-${Date.now()}`,
                        userName: agency.name,
                        pickupDate: toWareki(new Date().toISOString().split('T')[0]),
                        isAgency: true,
                        itemsList: itemsToDeliver.map(item => {
                            const ap = agencyPrices.find(p => p.agencyId === agency.id && p.productId === item.productId);
                            const storePriceTaxIn = ap ? ap.storePrice : 0;
                            const storePriceExTax = Math.floor(storePriceTaxIn / 1.08); // 税抜店頭価格
                            const feeAmountExTax = Math.floor(storePriceExTax * agency.feeRate); // 1個あたり委託手数料(税抜)
                            const billingExTax = storePriceExTax - feeAmountExTax; // 1個あたり卸価格(純売上・税抜)
                            return {
                                name: item.productName,
                                qty: item.qty,
                                storePriceTaxIn: storePriceTaxIn,
                                storePriceExTax: storePriceExTax,
                                feeAmountExTax: feeAmountExTax,
                                billingExTax: billingExTax
                            };
                        })
                    };
                    
                    setDeliveryCart({});
                    fetchData(viewStartMonth, viewEndMonth);
                    setPrintOrders([invoiceData]);
                    setPrintType('agency_invoice');

                } catch (error) { showMessage("納品エラーが発生しました。"); } 
                finally { setIsSubmittingDelivery(false); }
            };

            const handleAgencyInventory = async () => {
                if (!inventoryModal) return;
                const d = inventoryModal;
                if (invSalesQty + invLossQty !== d.deliveryQty) {
                    return showMessage("「売れた数」と「ロス」の合計が納品数と一致しません！", 5000);
                }

                setIsSubmittingDelivery(true);
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "agencyInventory", deliveryId: d.id, salesQty: invSalesQty, lossQty: invLossQty })
                    });
                    
                    showMessage(`棚卸し（精算）を完了しました！`);
                    setInventoryModal(null);
                    fetchData(viewStartMonth, viewEndMonth);
                } catch (error) { showMessage("精算エラーが発生しました。"); } 
                finally { setIsSubmittingDelivery(false); }
            };

            const openPrintPreview = (order, type) => {
                setPrintOrders([order]);
                setPrintType(type);
                setPrintName(order.userName || '');
            };

            const openMonthlyReportPreview = (customer) => {
                if (!customer) return;
                setPrintOrders([customer]); 
                setPrintType('monthly_report');
                setPrintName(customer.userName || '');
                setPrintHonorific('御中');
                
                const start = `${viewStartMonth}-01`;
                const [y, m] = viewEndMonth.split('-').map(Number);
                const endLastDay = new Date(y, m, 0).getDate();
                const end = `${viewEndMonth}-${String(endLastDay).padStart(2, '0')}`;
                
                setReportStartDate(start);
                setReportEndDate(end);
                setReportClosingDate(end);
                setShowCustomerModal(null); 
            };

            const openBulkPrintPreview = (type) => {
                const printableOrders = orders.filter(o => o.status !== 'キャンセル');
                if(printableOrders.length === 0) return showMessage("指定期間に印刷可能な注文がありません。");
                setPrintOrders(printableOrders);
                setPrintType(type);
            };

            const executePrint = () => window.print();

            // ローディング画面
            if (isLoadingData) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-50 text-gray-500">
                        <div className="spinner spinner-dark mb-4"></div>

                                                    棚卸し入力
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </section>

                        <section className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 pb-10">
                            <h3 className="font-bold text-gray-700 text-sm mb-3">最近の精算履歴</h3>
                            <div className="space-y-2">
                                {completedDeliveries.slice(0, 5).map(d => (
                                    <div key={d.id} className="text-xs flex justify-between items-center border-b border-gray-100 pb-2 last:border-0 last:pb-0">
                                        <div>
                                            <span className="font-bold text-gray-700">{d.agencyName}</span>
                                            <span className="text-gray-500 ml-1">{d.productName}</span>
                                            <div className="text-[9px] text-gray-400 mt-0.5">納品:{d.deliveryQty} 売上:{d.salesQty} ロス:{d.lossQty} ({d.date})</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="font-bold text-agency-dark">¥{(d.pureSalesExTax * 1.08).toLocaleString()} <span className="text-[9px] font-normal text-gray-500">(込概算)</span></div>
                                        </div>
                                    </div>
                                ))}
                                {completedDeliveries.length === 0 && <p className="text-xs text-gray-400">履歴なし</p>}
                            </div>
                        </section>
                    </div>
                );
            };

            const renderAnalyticsTab = () => {
                const formatMonth = (m) => m ? m.replace('-', '年') + '月' : '';
                const isSingleMonth = viewStartMonth === viewEndMonth;
                const periodText = isSingleMonth ? formatMonth(viewStartMonth) : `${formatMonth(viewStartMonth)} 〜 ${formatMonth(viewEndMonth)}`;

                const anData = analytics || {};
                const topProducts = anData.topProducts || [];
                const topCustomers = anData.topCustomers || [];
                const stockStats = anData.stockStats || [];
                const agencyLossRates = anData.agencyLossRates || [];

                return (
                    <div className="animate-slide-up space-y-5 relative z-10">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex flex-wrap items-center gap-2 bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm w-fit">
                                <Icons.Calendar className="w-4 h-4 text-gray-500" />
                                <input type="month" value={viewStartMonth} onChange={(e) => setViewStartMonth(e.target.value)}
                                    className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer w-24" />
                                <span className="text-gray-400 font-bold">〜</span>
                                <input type="month" value={viewEndMonth} onChange={(e) => setViewEndMonth(e.target.value)}
                                    className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer w-24" />
                            </div>
                            <button type="button" onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full shadow-sm text-gray-500 active:bg-gray-100">
                                <Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} />
                            </button>
                        </div>

                        <div className="flex justify-between items-end border-l-4 border-blue-600 pl-2">
                            <h1 className="text-xl font-bold text-gray-800">総合分析</h1>
                            <span className="text-xs font-bold text-gray-500">{periodText}</span>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 relative">
                            {/* ★総売上を直販と委託に分割 */}
                            <div className="col-span-2 bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-200">
                                <div className="text-xs text-blue-700 font-bold mb-1 flex items-center gap-1"><Icons.TrendingUp className="w-3 h-3"/> 指定期間の総売上 (税込)</div>
                                <div className="text-3xl font-bold text-blue-900 tracking-tight mb-2">¥{(anData.monthlySales || 0).toLocaleString()}</div>
                                <div className="flex justify-between pt-2 border-t border-blue-200 text-xs text-blue-800 font-bold">
                                    <span>直販・店頭: ¥{(anData.directSalesTotal || 0).toLocaleString()}</span>
                                    <span>委託(純額): ¥{(anData.agencySalesTotal || 0).toLocaleString()}</span>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <div className="text-xs text-gray-500 font-bold mb-1 flex items-center gap-1"><Icons.ClipboardList className="w-3 h-3"/> 直販 注文・販売件数</div>
                                <div className="text-2xl font-bold text-gray-900 tracking-tight">{anData.orderCount || 0} <span className="text-sm font-normal text-gray-500">件</span></div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <div className="text-xs text-gray-500 font-bold mb-1 flex items-center gap-1"><Icons.User className="w-3 h-3"/> 直販 平均客単価</div>
                                <div className="text-xl font-bold text-gray-900 tracking-tight">¥{(anData.averageSpend || 0).toLocaleString()}</div>
                            </div>
                            <div className="col-span-2 bg-red-50 p-4 rounded-xl shadow-sm border border-red-200">
                                <div className="text-xs text-red-600 font-bold mb-1 flex items-center gap-1"><Icons.AlertTriangle className="w-3 h-3"/> 総推定ロス金額 (直販＋委託)</div>
                                <div className="text-xl font-bold text-red-700 tracking-tight">¥{(anData.lossAmount || 0).toLocaleString()}</div>
                            </div>
                        </div>

                        {/* ★委託先別ロス率 */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-orange-200">
                            <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2"><Icons.Store className="w-4 h-4 text-agency-dark"/> 委託先別 ロス率</h3>
                            <div className="space-y-3">
                                {agencyLossRates.length > 0 ? (
                                    agencyLossRates.map((stat, idx) => {
                                        const barColor = stat.lossRate > 30 ? 'bg-red-500' : stat.lossRate > 10 ? 'bg-orange-400' : 'bg-green-500';
                                        return (
                                            <div key={idx}>
                                                <div className="flex justify-between items-end mb-1">
                                                    <div className="text-sm font-bold text-gray-800">{stat.name}</div>
                                                    <div className="text-xs text-gray-600">
                                                        <span className="font-bold text-red-600">{stat.lossRate}%</span> <span className="text-[10px]">(ロス{stat.lossQty} / 納品{stat.deliveryQty})</span>
                                                    </div>
                                                </div>
                                                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                    <div className={`${barColor} h-full transition-all duration-1000`} style={{ width: `${stat.lossRate}%` }}></div>
                                                </div>
                                            </div>
                                        )
                                    })
                                ) : (
                                    <p className="text-xs text-gray-500 text-center">委託データがありません</p>
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-700 text-sm mb-4 flex items-center gap-2"><Icons.ShoppingBag className="w-4 h-4 text-blue-500"/> 人気商品 (委託・店頭含む)</h3>
                            <div className="space-y-4">
                                {topProducts.length === 0 ? (
                                    <p className="text-sm text-gray-500 text-center py-4">データがありません</p>
                                ) : (
                                    <>
                                        {topProducts.slice(0, 5).map((p, idx) => {
                                            const maxQty = topProducts[0]?.qty || 1;
                                            const percent = Math.max(10, Math.round((p.qty / maxQty) * 100));
                                            const colors = ['bg-blue-500', 'bg-blue-400', 'bg-blue-300', 'bg-gray-400', 'bg-gray-300'];
                                            return (
                                                <div key={p.name}>
                                                    <div className="flex justify-between items-center mb-1">
                                                        <div className="text-sm font-bold text-gray-800 flex items-center gap-2"><span className="text-gray-400">{idx + 1}.</span> {p.name}</div>
                                                        <div className="text-sm font-bold text-gray-600">{p.qty} P</div>
                                                    </div>
                                                    <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                        <div className={`${colors[idx] || colors[4]} h-full transition-all duration-1000`} style={{ width: `${percent}%` }}></div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                        {topProducts.length > 5 && (
                                            <button type="button" onClick={() => setShowAllProductsModal(true)} className="w-full text-center text-xs font-bold text-blue-500 py-2 bg-blue-50 rounded-lg active:bg-blue-100 mt-2">
                                                すべて見る ({topProducts.length}件)
                                            </button>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-yellow-200">
                            <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2"><Icons.Award className="w-4 h-4 text-yellow-500"/> LINE優良顧客ランキング</h3>
                            <p className="text-[10px] text-gray-500 mb-3">※店頭・委託分は含まれません。リストをタップすると「購入カルテ」が開きます。</p>
                            <div className="space-y-2">
                                {topCustomers.length > 0 ? (
                                    <>
                                        {topCustomers.slice(0, 5).map((customer, idx) => (
                                            <div 
                                                key={customer.userId} 
                                                role="button"
                                                tabIndex={0}
                                                onClick={() => setShowCustomerModal(customer)} 
                                                className="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border border-gray-100 cursor-pointer hover:bg-gray-100 active:bg-gray-200 transition-colors relative z-10"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-yellow-400 text-yellow-900' : idx === 1 ? 'bg-gray-300 text-gray-800' : idx === 2 ? 'bg-orange-300 text-orange-900' : 'bg-gray-200 text-gray-600'}`}>{idx + 1}</div>
                                                    <div>
                                                        <div className="font-bold text-sm text-gray-800">{customer.userName} 様</div>
                                                        <div className="text-[10px] text-gray-500">注文回数: {customer.orderCount}回</div>
                                                    </div>
                                                </div>
                                                <div className="font-bold text-nanairo-dark">¥{(customer.totalSpend || 0).toLocaleString()}</div>
                                            </div>
                                        ))}
                                        {topCustomers.length > 5 && (
                                            <button type="button" onClick={() => setShowAllCustomersModal(true)} className="w-full text-center text-xs font-bold text-yellow-600 py-2 bg-yellow-50 rounded-lg active:bg-yellow-100 mt-2">
                                                すべて見る ({topCustomers.length}件)
                                            </button>
                                        )}
                                    </>
                                ) : (
                                    <p className="text-sm text-gray-500 text-center py-4">データがありません</p>
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 pb-10">
                            <h3 className="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><Icons.AlertTriangle className="w-4 h-4 text-gray-500"/> 商品別 直販ロス率</h3>
                            <p className="text-[10px] text-gray-500 mb-3">※委託先でのロスはここに含まれません。</p>
                            <div className="space-y-3">
                                {stockStats.length > 0 ? (
                                    stockStats.map((stat, idx) => {
                                        const barColor = stat.lossRate > 30 ? 'bg-red-500' : stat.lossRate > 10 ? 'bg-orange-400' : 'bg-green-500';
                                        return (
                                            <div key={idx}>
                                                <div className="flex justify-between items-end mb-1">
                                                    <div className="text-sm font-bold text-gray-800">{stat.name}</div>
                                                    <div className="text-xs text-gray-600">
                                                        <span className="font-bold text-red-600">{stat.lossRate}%</span> <span className="text-[10px]">(ロス{stat.lossQty} / 収穫{stat.harvestQty})</span>
                                                    </div>
                                                </div>
                                                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                    <div className={`${barColor} h-full transition-all duration-1000`} style={{ width: `${stat.lossRate}%` }}></div>
                                                </div>
                                            </div>
                                        )
                                    })
                                ) : (
                                    <p className="text-sm text-gray-500 text-center py-4">データがありません</p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="app-container">
                    <header className="no-print sticky top-0 z-30 bg-nanairo-light px-4 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-7 h-7 bg-line rounded-full flex items-center justify-center text-white font-bold text-[9px] tracking-tighter">LINE</div>
                            <span className="font-bold text-gray-800 text-sm">マイクロハーブ <span className="text-nanairo-dark text-xs ml-1">[管理]</span></span>
                        </div>
                    </header>

                    {message && (
                        <div className="no-print pointer-events-none fixed top-16 left-0 right-0 mx-auto w-11/12 max-w-[500px] z-[90] bg-nanairo-light border border-nanairo text-nanairo-dark px-4 py-3 rounded-xl flex items-center gap-2 animate-slide-up shadow-lg">
                            <Icons.Check className="w-5 h-5 shrink-0" />
                            <span className="font-bold text-sm">{message}</span>
                        </div>
                    )}

                    <main className="no-print flex-1 px-4 pt-4 pb-[120px] relative z-0">
                        {activeTab === 'orders' && renderOrdersTab()}
                        {activeTab === 'inventory' && renderInventoryTab()}
                        {activeTab === 'agency' && renderAgencyTab()}
                        {activeTab === 'analytics' && renderAnalyticsTab()}
                    </main>

                    {/* モーダル群 */}
                    {renderPrintView()}
                    
                    {/* 棚卸し入力モーダル */}
                    {inventoryModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="mb-4">
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">棚卸し入力</h3>
                                    <p className="text-sm text-gray-600 bg-gray-50 p-2 rounded">{inventoryModal.agencyName}<br/><span className="font-bold text-black">{inventoryModal.productName}</span> (納品数: {inventoryModal.deliveryQty})</p>
                                </div>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-bold text-blue-600 mb-1">売れた数 (実売数)</label>
                                        <div className="flex items-center border-2 border-blue-200 rounded-xl bg-blue-50 h-12 overflow-hidden">
                                            <button type="button" onClick={() => {
                                                const next = Math.max(0, invSalesQty - 1);
                                                setInvSalesQty(next);
                                                setInvLossQty(inventoryModal.deliveryQty - next);
                                            }} className="w-12 h-full flex justify-center items-center text-blue-600 bg-blue-100 active:bg-blue-200"><Icons.Minus className="w-4 h-4" /></button>
                                            <div className="flex-1 text-center font-bold text-lg text-blue-900 pt-1">{invSalesQty}</div>
                                            <button type="button" onClick={() => {
                                                const next = Math.min(inventoryModal.deliveryQty, invSalesQty + 1);
                                                setInvSalesQty(next);
                                                setInvLossQty(inventoryModal.deliveryQty - next);
                                            }} className="w-12 h-full flex justify-center items-center text-blue-600 bg-blue-100 active:bg-blue-200"><Icons.Plus className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold text-red-600 mb-1">回収した数 (ロス)</label>
                                        <div className="flex items-center border-2 border-red-200 rounded-xl bg-red-50 h-12 overflow-hidden">
                                            <button type="button" onClick={() => {
                                                const next = Math.max(0, invLossQty - 1);
                                                setInvLossQty(next);
                                                setInvSalesQty(inventoryModal.deliveryQty - next);
                                            }} className="w-12 h-full flex justify-center items-center text-red-600 bg-red-100 active:bg-red-200"><Icons.Minus className="w-4 h-4" /></button>
                                            <div className="flex-1 text-center font-bold text-lg text-red-900 pt-1">{invLossQty}</div>
                                            <button type="button" onClick={() => {
                                                const next = Math.min(inventoryModal.deliveryQty, invLossQty + 1);
                                                setInvLossQty(next);
                                                setInvSalesQty(inventoryModal.deliveryQty - next);
                                            }} className="w-12 h-full flex justify-center items-center text-red-600 bg-red-100 active:bg-red-200"><Icons.Plus className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    
                                    <div className="text-center text-xs font-bold text-gray-500 bg-gray-100 p-2 rounded">
                                        合計: {invSalesQty + invLossQty} / 納品数: {inventoryModal.deliveryQty}
                                        {invSalesQty + invLossQty !== inventoryModal.deliveryQty && (
                                            <span className="block text-red-500 mt-1">※合計が納品数と一致しません</span>
                                        )}
                                    </div>
                                </div>
                                
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setInventoryModal(null)} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">
                                        キャンセル
                                    </button>
                                    <button type="button" onClick={handleAgencyInventory} disabled={isSubmittingDelivery || (invSalesQty + invLossQty !== inventoryModal.deliveryQty)} className={`flex-1 font-bold py-3 rounded-xl flex justify-center items-center gap-2 ${isSubmittingDelivery || (invSalesQty + invLossQty !== inventoryModal.deliveryQty) ? 'bg-gray-300 text-gray-500' : 'bg-agency text-white active:bg-orange-600'}`}>
                                        {isSubmittingDelivery ? <div className="spinner border-l-white w-4 h-4"></div> : '精算確定'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ボトムナビゲーション */}
                    <div className="no-print fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[600px] bg-white border-t border-gray-200 flex h-[60px] z-40 pb-[env(safe-area-inset-bottom)] box-border">
                        <button type="button" onClick={() => setActiveTab('orders')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'orders' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.ClipboardList className="w-6 h-6" />
                                {orders.filter(o=>o.status==='未対応').length > 0 && (
                                    <div className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>
                                )}
                            </div>
                            <span className="text-[10px] font-bold">注文対応</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('inventory')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'inventory' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.Box className="w-6 h-6" />
                            <span className="text-[10px] font-bold">在庫・販売</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('agency')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'agency' ? 'text-agency' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.Truck className="w-6 h-6" />
                                {agencyDeliveries.filter(d => d.status === "納品済").length > 0 && (
                                    <div className="absolute -top-1 -right-1 w-3 h-3 bg-agency rounded-full border-2 border-white"></div>
                                )}
                            </div>
                            <span className="text-[10px] font-bold">委託(卸し)</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('analytics')} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === 'analytics' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.TrendingUp className="w-6 h-6" />
                            <span className="text-[10px] font-bold">分析</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
